<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Studio 201 - Workshop</title>
<style>
@font-face{font-family:'DSIndigo';src:url('https://docusign.github.io/PSA/Bengaluru-meetup/assets/fonts/DSIndigo-Light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap;}
@font-face{font-family:'DSIndigo';src:url('https://docusign.github.io/PSA/Bengaluru-meetup/assets/fonts/DSIndigo-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'DSIndigo';src:url('https://docusign.github.io/PSA/Bengaluru-meetup/assets/fonts/DSIndigo-SemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap;}

:root{
  --indigo:#4C00FF;
  --ink:#130032;
  --surface:#F4F2FA;
  --hairline:#e5e1f0;
  --muted:#615a75;
  --font:'DSIndigo',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font);font-weight:300;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;}

.picker{
  background:var(--surface);
  border-bottom:1px solid var(--hairline);
  padding:18px 30px;
  display:flex;
  align-items:center;
  gap:18px;
}
.picker h3{font-size:16px;font-weight:600;color:var(--ink);}
.toggle{
  display:inline-flex;
  gap:0;
  border:1px solid var(--hairline);
  border-radius:9px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(19,0,50,.05);
}
.toggle button{
  background:#fff;
  border:none;
  padding:8px 16px;
  font-family:var(--font);
  font-size:13.5px;
  font-weight:500;
  cursor:pointer;
  color:var(--muted);
  transition:background .16s ease,color .16s ease;
}
.toggle button:not(.on):hover{background:#f2eefc;color:var(--ink);}
.toggle button.on{background:var(--indigo);color:#fff;}

.frame-wrap{
  position:relative;
  width:100%;
  height:calc(100vh - 62px);
}
.frame-wrap iframe{
  position:absolute;
  top:0;left:0;
  width:100%;
  height:100%;
  border:none;
  display:none;
}
.frame-wrap iframe.active{display:block;}
</style>
</head>
<body>

<div class="picker">
  <h3>Pick your scenario</h3>
  <div class="toggle" id="toggle">
    <button data-tab="nda" class="on">NDA</button>
    <button data-tab="procurement">Procurement</button>
  </div>
</div>

<div class="frame-wrap">
  <iframe id="frame-nda" class="active" src="NDA-Assistant-Flow.html"></iframe>
  <iframe id="frame-procurement" src="2_Hands_on_Flow.html"></iframe>
</div>

<script>
document.querySelectorAll('#toggle button').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('#toggle button').forEach(function(b){b.classList.remove('on');});
    document.querySelectorAll('.frame-wrap iframe').forEach(function(f){f.classList.remove('active');});
    btn.classList.add('on');
    document.getElementById('frame-'+btn.dataset.tab).classList.add('active');
  });
});
</script>
</body>
</html>
