<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Studio 201 - Workshop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:#fff;}
.frame-wrap{position:relative;width:100%;height:100vh;}
.frame-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:none;}
.frame-wrap iframe.active{display:block;}
</style>
</head>
<body>

<div class="frame-wrap">
  <iframe id="frame-nda" class="active" src="NDA-Assistant-Flow.html"></iframe>
  <iframe id="frame-procurement" src="2_Hands_on_Flow.html"></iframe>
</div>

<script>
var current='nda';

function injectToggle(doc,active){
  var existing=doc.getElementById('lab-toggle');
  if(existing) existing.parentNode.removeChild(existing);

  var card=doc.createElement('div');
  card.id='lab-toggle';
  card.style.cssText='background:#F4F2FA;border:1px solid #e5e1f0;border-radius:13px;padding:16px 18px;margin:18px 0;box-shadow:0 2px 6px rgba(19,0,50,.05),0 10px 26px rgba(19,0,50,.05);';
  card.innerHTML='<div style="display:inline-flex;gap:0;border:1px solid #e5e1f0;border-radius:9px;overflow:hidden;box-shadow:0 1px 3px rgba(19,0,50,.05);">'
    +'<button data-sc="nda" style="background:'+(active==='nda'?'#4C00FF':'#fff')+';border:none;padding:8px 16px;font-family:DSIndigo,Arial,sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;color:'+(active==='nda'?'#fff':'#615a75')+';">Lab 1: NDA</button>'
    +'<button data-sc="procurement" style="background:'+(active==='procurement'?'#4C00FF':'#fff')+';border:none;padding:8px 16px;font-family:DSIndigo,Arial,sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;color:'+(active==='procurement'?'#fff':'#615a75')+';">Lab 2: Procurement</button>'
    +'</div>';

  var btns=card.querySelectorAll('button');
  btns.forEach(function(btn){
    btn.addEventListener('click',function(){
      switchTo(btn.getAttribute('data-sc'));
    });
  });

  return card;
}

function switchTo(tab){
  current=tab;
  document.querySelectorAll('.frame-wrap iframe').forEach(function(f){f.classList.remove('active');});
  document.getElementById('frame-'+tab).classList.add('active');
  setupFrame('frame-nda');
  setupFrame('frame-procurement');
}

function setupFrame(id){
  var iframe=document.getElementById(id);
  var doc;
  try{doc=iframe.contentDocument||iframe.contentWindow.document;}catch(e){return;}
  if(!doc||!doc.body) return;

  var tab=id.replace('frame-','');

  // Hide the persona card and prerequisites in procurement page
  if(tab==='procurement'){
    var personaCards=doc.querySelectorAll('.card.tint');
    personaCards.forEach(function(c){
      if(c.querySelector('#persona')){c.style.display='none';}
    });
    doc.body.setAttribute('data-persona','procurement');

    // Hide prerequisites (0.6) and how to use this handbook (0.7)
    var headings=doc.querySelectorAll('h3');
    headings.forEach(function(h){
      if(h.textContent.indexOf('Prerequisites')!==-1 || h.textContent.indexOf('How to use this handbook')!==-1){
        var el=h;
        while(el){
          var next=el.nextElementSibling;
          if(!next) break;
          if(next.tagName==='H3') break;
          next.style.display='none';
          el=next;
        }
        h.style.display='none';
        if(h.previousElementSibling && h.previousElementSibling.tagName==='H3' && h.previousElementSibling.innerHTML.trim()==='<br>'){
          h.previousElementSibling.style.display='none';
        }
      }
    });

    // Rebuild SVG diagram for new flow
    var svg=doc.querySelector('svg[viewBox]');
    if(svg && !doc.getElementById('nodeChangeStatus')){
      var ns='http://www.w3.org/2000/svg';
      var svgTexts=svg.querySelectorAll('text');

      // Hide everything in the original SVG, then rebuild
      svg.querySelectorAll('rect,line,path,polygon,text,circle').forEach(function(el){el.style.display='none';});
      // Keep defs (arrows)
      svg.querySelectorAll('defs *').forEach(function(el){el.style.display='';});

      svg.setAttribute('viewBox','0 0 940 420');

      // --- MAIN ROW: Agreement Desk -> Risk Analyst -> Branch ---
      // Agreement Desk
      var ad=document.createElementNS(ns,'rect');
      ad.setAttribute('x','30');ad.setAttribute('y','165');ad.setAttribute('width','150');ad.setAttribute('height','64');ad.setAttribute('rx','12');ad.setAttribute('fill','#4C00FF');
      svg.appendChild(ad);
      var adT1=document.createElementNS(ns,'text');adT1.setAttribute('x','105');adT1.setAttribute('y','192');adT1.setAttribute('text-anchor','middle');adT1.setAttribute('fill','#fff');adT1.setAttribute('font-size','13');adT1.setAttribute('font-weight','600');adT1.textContent='Agreement Desk';svg.appendChild(adT1);
      var adT2=document.createElementNS(ns,'text');adT2.setAttribute('x','105');adT2.setAttribute('y','209');adT2.setAttribute('text-anchor','middle');adT2.setAttribute('fill','#e7deff');adT2.setAttribute('font-size','10.5');adT2.textContent='Email intake';svg.appendChild(adT2);

      // Edge AD -> Agent
      var e1=document.createElementNS(ns,'line');e1.setAttribute('x1','180');e1.setAttribute('y1','197');e1.setAttribute('x2','220');e1.setAttribute('y2','197');e1.setAttribute('stroke','#c9bdf0');e1.setAttribute('stroke-width','2.5');e1.setAttribute('marker-end','url(#arrow)');svg.appendChild(e1);

      // Risk Analyst
      var ra=document.createElementNS(ns,'rect');ra.setAttribute('x','221');ra.setAttribute('y','165');ra.setAttribute('width','150');ra.setAttribute('height','64');ra.setAttribute('rx','12');ra.setAttribute('fill','#9A1FA8');svg.appendChild(ra);
      var raT1=document.createElementNS(ns,'text');raT1.setAttribute('x','296');raT1.setAttribute('y','188');raT1.setAttribute('text-anchor','middle');raT1.setAttribute('fill','#fff');raT1.setAttribute('font-size','12.5');raT1.setAttribute('font-weight','600');raT1.textContent='Risk Analyst';svg.appendChild(raT1);
      var raT2=document.createElementNS(ns,'text');raT2.setAttribute('x','296');raT2.setAttribute('y','203');raT2.setAttribute('text-anchor','middle');raT2.setAttribute('fill','#f2ddff');raT2.setAttribute('font-size','10.5');raT2.textContent='Agent Studio';svg.appendChild(raT2);
      var raT3=document.createElementNS(ns,'text');raT3.setAttribute('x','296');raT3.setAttribute('y','217');raT3.setAttribute('text-anchor','middle');raT3.setAttribute('fill','#e3b6ff');raT3.setAttribute('font-size','10');raT3.textContent='reads attached doc';svg.appendChild(raT3);

      // Edge Agent -> Branch
      var e2=document.createElementNS(ns,'line');e2.setAttribute('x1','371');e2.setAttribute('y1','197');e2.setAttribute('x2','410');e2.setAttribute('y2','197');e2.setAttribute('stroke','#c9bdf0');e2.setAttribute('stroke-width','2.5');e2.setAttribute('marker-end','url(#arrow)');svg.appendChild(e2);

      // Branch diamond
      var diamond=document.createElementNS(ns,'polygon');diamond.setAttribute('points','455,157 500,197 455,237 410,197');diamond.setAttribute('fill','#fff');diamond.setAttribute('stroke','#4C00FF');diamond.setAttribute('stroke-width','2');svg.appendChild(diamond);
      var dT1=document.createElementNS(ns,'text');dT1.setAttribute('x','455');dT1.setAttribute('y','193');dT1.setAttribute('text-anchor','middle');dT1.setAttribute('fill','#130032');dT1.setAttribute('font-size','10.5');dT1.setAttribute('font-weight','600');dT1.textContent='risk';svg.appendChild(dT1);
      var dT2=document.createElementNS(ns,'text');dT2.setAttribute('x','455');dT2.setAttribute('y','205');dT2.setAttribute('text-anchor','middle');dT2.setAttribute('fill','#130032');dT2.setAttribute('font-size','10.5');dT2.setAttribute('font-weight','600');dT2.textContent='_level?';svg.appendChild(dT2);

      // --- LOW PATH (straight right): Change Status "Success" ---
      var lowLabel=document.createElementNS(ns,'text');lowLabel.setAttribute('x','530');lowLabel.setAttribute('y','187');lowLabel.setAttribute('text-anchor','middle');lowLabel.setAttribute('font-size','11');lowLabel.setAttribute('font-weight','600');lowLabel.setAttribute('fill','#0a7d3c');lowLabel.textContent='LOW';svg.appendChild(lowLabel);
      var e3=document.createElementNS(ns,'line');e3.setAttribute('x1','500');e3.setAttribute('y1','197');e3.setAttribute('x2','560');e3.setAttribute('y2','197');e3.setAttribute('stroke','#0a7d3c');e3.setAttribute('stroke-width','2.5');e3.setAttribute('marker-end','url(#arrow)');svg.appendChild(e3);

      var csRect=document.createElementNS(ns,'rect');csRect.setAttribute('id','nodeChangeStatus');csRect.setAttribute('x','561');csRect.setAttribute('y','165');csRect.setAttribute('width','140');csRect.setAttribute('height','64');csRect.setAttribute('rx','12');csRect.setAttribute('fill','#0a7d3c');svg.appendChild(csRect);
      var csT1=document.createElementNS(ns,'text');csT1.setAttribute('x','631');csT1.setAttribute('y','192');csT1.setAttribute('text-anchor','middle');csT1.setAttribute('fill','#fff');csT1.setAttribute('font-size','12');csT1.setAttribute('font-weight','600');csT1.textContent='Change Status';svg.appendChild(csT1);
      var csT2=document.createElementNS(ns,'text');csT2.setAttribute('x','631');csT2.setAttribute('y','209');csT2.setAttribute('text-anchor','middle');csT2.setAttribute('fill','#d7f5e2');csT2.setAttribute('font-size','10.5');csT2.textContent='Success';svg.appendChild(csT2);

      // --- MED/HIGH PATH (down): Assign Owner -> Send Message -> Change Status ---
      var mhLabel=document.createElementNS(ns,'text');mhLabel.setAttribute('x','470');mhLabel.setAttribute('y','260');mhLabel.setAttribute('font-size','11');mhLabel.setAttribute('font-weight','600');mhLabel.setAttribute('fill','#FF5252');mhLabel.textContent='MED / HIGH';svg.appendChild(mhLabel);
      var e4=document.createElementNS(ns,'path');e4.setAttribute('d','M455,237 V280');e4.setAttribute('stroke','#FF5252');e4.setAttribute('stroke-width','2.5');e4.setAttribute('fill','none');e4.setAttribute('marker-end','url(#arrow)');svg.appendChild(e4);

      // Assign Owner
      var ao=document.createElementNS(ns,'rect');ao.setAttribute('x','380');ao.setAttribute('y','282');ao.setAttribute('width','150');ao.setAttribute('height','56');ao.setAttribute('rx','12');ao.setAttribute('fill','#C0207E');svg.appendChild(ao);
      var aoT1=document.createElementNS(ns,'text');aoT1.setAttribute('x','455');aoT1.setAttribute('y','306');aoT1.setAttribute('text-anchor','middle');aoT1.setAttribute('fill','#fff');aoT1.setAttribute('font-size','12');aoT1.setAttribute('font-weight','600');aoT1.textContent='Assign Owner';svg.appendChild(aoT1);
      var aoT2=document.createElementNS(ns,'text');aoT2.setAttribute('x','455');aoT2.setAttribute('y','322');aoT2.setAttribute('text-anchor','middle');aoT2.setAttribute('fill','#ffe0ef');aoT2.setAttribute('font-size','10.5');aoT2.textContent='Legal team';svg.appendChild(aoT2);

      // Edge Assign Owner -> Send Message
      var e5=document.createElementNS(ns,'line');e5.setAttribute('x1','530');e5.setAttribute('y1','310');e5.setAttribute('x2','570');e5.setAttribute('y2','310');e5.setAttribute('stroke','#c9bdf0');e5.setAttribute('stroke-width','2.5');e5.setAttribute('marker-end','url(#arrow)');svg.appendChild(e5);

      // Send Message
      var sm=document.createElementNS(ns,'rect');sm.setAttribute('x','571');sm.setAttribute('y','282');sm.setAttribute('width','150');sm.setAttribute('height','56');sm.setAttribute('rx','12');sm.setAttribute('fill','#6A17C9');svg.appendChild(sm);
      var smT1=document.createElementNS(ns,'text');smT1.setAttribute('x','646');smT1.setAttribute('y','306');smT1.setAttribute('text-anchor','middle');smT1.setAttribute('fill','#fff');smT1.setAttribute('font-size','12');smT1.setAttribute('font-weight','600');smT1.textContent='Send Message';svg.appendChild(smT1);
      var smT2=document.createElementNS(ns,'text');smT2.setAttribute('x','646');smT2.setAttribute('y','322');smT2.setAttribute('text-anchor','middle');smT2.setAttribute('fill','#e7deff');smT2.setAttribute('font-size','10.5');smT2.textContent='Notify reviewer';svg.appendChild(smT2);

      // Edge Send Message -> Change Status
      var e6=document.createElementNS(ns,'line');e6.setAttribute('x1','721');e6.setAttribute('y1','310');e6.setAttribute('x2','761');e6.setAttribute('y2','310');e6.setAttribute('stroke','#c9bdf0');e6.setAttribute('stroke-width','2.5');e6.setAttribute('marker-end','url(#arrow)');svg.appendChild(e6);

      // Change Status (Pending Legal Review)
      var plr=document.createElementNS(ns,'rect');plr.setAttribute('x','762');plr.setAttribute('y','282');plr.setAttribute('width','150');plr.setAttribute('height','56');plr.setAttribute('rx','12');plr.setAttribute('fill','#FF5252');svg.appendChild(plr);
      var plrT1=document.createElementNS(ns,'text');plrT1.setAttribute('x','837');plrT1.setAttribute('y','302');plrT1.setAttribute('text-anchor','middle');plrT1.setAttribute('fill','#fff');plrT1.setAttribute('font-size','11.5');plrT1.setAttribute('font-weight','600');plrT1.textContent='Change Status';svg.appendChild(plrT1);
      var plrT2=document.createElementNS(ns,'text');plrT2.setAttribute('x','837');plrT2.setAttribute('y','318');plrT2.setAttribute('text-anchor','middle');plrT2.setAttribute('fill','#ffe0ef');plrT2.setAttribute('font-size','10');plrT2.textContent='Pending Legal Review';svg.appendChild(plrT2);

      // Animated particles - route paths
      var routeLow=document.createElementNS(ns,'path');routeLow.setAttribute('id','route-low-new');routeLow.setAttribute('d','M105,197 L296,197 L455,197 L631,197');routeLow.setAttribute('fill','none');svg.appendChild(routeLow);
      var routeHigh=document.createElementNS(ns,'path');routeHigh.setAttribute('id','route-high-new');routeHigh.setAttribute('d','M105,197 L296,197 L455,197 L455,310 L646,310 L837,310');routeHigh.setAttribute('fill','none');svg.appendChild(routeHigh);

      // LOW particle
      var pLow=document.createElementNS(ns,'circle');pLow.setAttribute('r','5');pLow.setAttribute('fill','#0a7d3c');pLow.setAttribute('style','filter:drop-shadow(0 0 5px #0a7d3c)');
      var amLow=document.createElementNS(ns,'animateMotion');amLow.setAttribute('dur','3.2s');amLow.setAttribute('repeatCount','indefinite');
      var mpLow=document.createElementNS(ns,'mpath');mpLow.setAttribute('href','#route-low-new');
      amLow.appendChild(mpLow);pLow.appendChild(amLow);svg.appendChild(pLow);

      // MED/HIGH particle
      var pHigh=document.createElementNS(ns,'circle');pHigh.setAttribute('r','5');pHigh.setAttribute('fill','#FF5252');pHigh.setAttribute('style','filter:drop-shadow(0 0 5px #FF5252)');
      var amHigh=document.createElementNS(ns,'animateMotion');amHigh.setAttribute('dur','4s');amHigh.setAttribute('repeatCount','indefinite');
      var mpHigh=document.createElementNS(ns,'mpath');mpHigh.setAttribute('href','#route-high-new');
      amHigh.appendChild(mpHigh);pHigh.appendChild(amHigh);svg.appendChild(pHigh);
    }

    // Update decision tree table (section 2.6)
    var tables=doc.querySelectorAll('table');
    tables.forEach(function(t){
      var rows=t.querySelectorAll('tr');
      rows.forEach(function(r){
        var cells=r.querySelectorAll('td');
        if(cells.length>=3){
          if(cells[0].textContent.indexOf('Low risk')!==-1){
            cells[2].innerHTML='<b>Change Request Status</b> to Success. The request owner can then send the document for eSignature.';
          }
          if(cells[0].textContent.indexOf('Medium or high')!==-1){
            cells[2].innerHTML='<b>Assign Owner</b> (Legal team), <b>Send Request Message</b> to notify them, then <b>Change Request Status</b> to Pending Legal Review.';
          }
          // Remove fallback row
          if(cells[0].textContent.indexOf('Fallback')!==-1){
            r.style.display='none';
          }
        }
      });
    });

    // Update 0.4 Reading the diagram
    var diagramCards=doc.querySelectorAll('.card.tint.diagram');
    diagramCards.forEach(function(card){
      var items=card.querySelectorAll('div');
      items.forEach(function(item){
        var n=item.querySelector('.n');
        if(n && n.textContent==='2'){
          var inner=item.querySelector('div');
          if(inner) inner.innerHTML='<b>Risk Analyst agent</b>the agent reads the document attached to the request and returns a structured response containing <code>risk_level</code>, <code>liability_cap</code>, <code>governing_law</code>, <code>term</code>, and <code>discount</code>.';
        }
        if(n && n.textContent==='3'){
          var inner=item.querySelector('div');
          if(inner) inner.innerHTML='<b>Branch on risk_level</b>LOW changes status to Success (owner sends for eSign); MEDIUM or HIGH assigns Legal, sends a message, and sets status to Pending Legal Review. The agent scores - the workflow decides.';
        }
        if(n && n.textContent==='4'){
          var inner=item.querySelector('div');
          if(inner) item.style.display='none';
        }
        if(n && n.textContent==='5'){
          var inner=item.querySelector('div');
          if(inner) item.style.display='none';
        }
      });
    });

    // Update scenario description
    var procCards=doc.querySelectorAll('.card.proc-only');
    procCards.forEach(function(card){
      var ps=card.querySelectorAll('p');
      ps.forEach(function(p){
        if(p.textContent.indexOf('LOW risk goes straight to the vendor for signature')!==-1){
          p.innerHTML=p.innerHTML.replace(
            'LOW risk goes straight to the vendor for signature; MEDIUM or HIGH risk waits for Legal.',
            'LOW risk changes the request status to Success and the owner sends for signature; MEDIUM or HIGH risk assigns the Legal team and sets status to Pending Legal Review.'
          );
        }
        if(p.textContent.indexOf('Agreement Desk request starts a workflow that hands the vendor MSA to a Risk Analyst agent')!==-1){
          p.innerHTML=p.innerHTML.replace(
            'an Agreement Desk request starts a workflow that hands the vendor MSA to a Risk Analyst agent, which extracts the key terms and classifies risk',
            'an email with the contract attached creates an Agreement Desk request, which triggers a workflow that hands the document to a Risk Analyst agent to extract key terms and classify risk'
          );
        }
      });
    });

    // Update the pipeline summary
    var allPs=doc.querySelectorAll('p');
    allPs.forEach(function(p){
      if(p.style && p.style.fontWeight==='600' && p.textContent.indexOf('Create request')!==-1 && p.textContent.indexOf('Desk request event')!==-1){
        p.innerHTML='<b>Email with contract → Agreement Desk request created → Workflow triggered (request submitted) → Risk Analyst agent → branch on risk_level → Change Status.</b>';
      }
    });

    // === Hide phantom image in 1.1 (Vendor and Renewal Risk Analyst agent configuration) ===
    var imgs=doc.querySelectorAll('img');
    imgs.forEach(function(img){
      if(img.alt && img.alt.indexOf('Vendor and Renewal Risk Analyst agent configuration')!==-1) img.style.display='none';
    });

    // === Section 1.2: Rename to "Define what starts this agent", inject new steps before prompt ===
    var hChecks=doc.querySelectorAll('.h-check');
    hChecks.forEach(function(hc){
      var h3=hc.querySelector('h3');
      if(h3 && h3.textContent.indexOf('1.2')!==-1 && h3.textContent.indexOf('Write the instructions')!==-1){
        h3.innerHTML='1.2 &middot; Define what starts this agent';
        // Hide old paragraph
        var el=hc.nextElementSibling;
        if(el && el.tagName==='P') el.style.display='none';
        // Hide the "Instructions" label
        var lbl=el?el.nextElementSibling:null;
        if(lbl && lbl.classList && lbl.classList.contains('lbl')) lbl.style.display='none';
        // Hide the prompt block (moves to 1.3)
        var promptBlock=lbl?lbl.nextElementSibling:null;
        if(promptBlock && promptBlock.classList && promptBlock.classList.contains('block')) promptBlock.style.display='none';
        // Inject new 1.2 content
        var newContent=doc.createElement('div');
        newContent.innerHTML='<ol style="margin:10px 0 0;">'
          +'<li>Click <b>In chat</b> under "Define what starts this agent".</li>'
          +'<li>In the prompt field, type: <code>Extracts key terms from the attached document and classify the risk.</code></li>'
          +'<li>Click <b>Save</b>, then scroll to the bottom and click <b>Save</b> again.</li>'
          +'<li>Now click <b>In a workflow</b> (next to "In chat").</li>'
          +'<li>Add the following outputs:</li>'
          +'</ol>'
          +'<table style="margin:10px 0;"><tbody>'
          +'<tr><th>Output name</th><th>Type</th></tr>'
          +'<tr><td><code>risk_level</code></td><td>Text</td></tr>'
          +'<tr><td><code>liability_cap</code></td><td>Text</td></tr>'
          +'<tr><td><code>governing_law</code></td><td>Text</td></tr>'
          +'<tr><td><code>term</code></td><td>Text</td></tr>'
          +'<tr><td><code>discount</code></td><td>Text</td></tr>'
          +'</tbody></table>'
          +'<ol start="6"><li>Scroll to the bottom and click <b>Save</b>.</li></ol>';
        hc.parentNode.insertBefore(newContent,hc.nextElementSibling);
      }
    });

    // === Section 1.3: Rename from "Configure capabilities" to "Write the instructions" ===
    hChecks.forEach(function(hc){
      var h3=hc.querySelector('h3');
      if(h3 && h3.textContent.indexOf('1.3')!==-1 && h3.textContent.indexOf('Configure capabilities')!==-1){
        h3.innerHTML='1.3 &middot; Write the instructions';
        // Replace the paragraph
        var el=hc.nextElementSibling;
        if(el && el.tagName==='P') el.innerHTML='Paste this into the Agent\'s <b>Instructions</b> field. The response shape you want is described here in plain language, so be explicit about field names and allowed values.';
        // Replace the capabilities table with the prompt block
        if(el) el=el.nextElementSibling;
        if(el && el.tagName==='TABLE'){
          var newLbl=doc.createElement('div');newLbl.className='lbl';newLbl.textContent='Instructions';
          el.parentNode.insertBefore(newLbl,el);
          var block=doc.createElement('div');
          block.className='block prompt';
          block.style.cssText='position:relative;white-space:pre-wrap;';
          block.textContent='You are a contract risk analyst. You receive one contract at a time.\n\n1. Determine whether this is a vendor contract or a customer renewal, based on the parties and context.\n\n2. Extract the following fields:\n- risk_level: one of LOW, MEDIUM, HIGH\n- liability_cap: short human-readable description of the limitation of liability\n- governing_law: the governing jurisdiction or venue\n- term: total term or renewal period (for example "1 year" or "3-year initial term with 1-year renewals")\n- discount: any commercial discount (for example "10% discount on list price"), or "none"\n\n3. Classify risk_level using these rules:\n- HIGH if there is no liability cap, or the cap is clearly nominal relative to the deal.\n- HIGH if a discount exceeds 30%, or the term is shorter than 12 months.\n- MEDIUM if the commercial terms are acceptable but the governing law is non-standard, or if any key term is ambiguous.\n- LOW only if the liability cap, term, discount, and governing law all look standard and unremarkable.\n- If you cannot confidently determine a key term, do not guess - choose MEDIUM or HIGH and say why in the field value.\n\nConstraints\n- All five fields must be present on every response. Use "none" or "not specified" rather than omitting a field.\n- Be precise and neutral. This is internal policy evaluation, not legal advice.\n- Do not take external actions. Only analyze.';
          el.parentNode.insertBefore(block,el);
          el.style.display='none';
        }
      }
    });

    // === Section 1.4: Renumber old 1.3 capabilities section (now after our injected 1.3) ===
    // We already replaced 1.3's content above, so we need a NEW 1.4 for capabilities
    // Insert a new h-check for 1.4 after the prompt block we just created
    hChecks.forEach(function(hc){
      var h3=hc.querySelector('h3');
      if(h3 && h3.textContent.indexOf('1.3')!==-1 && h3.textContent.indexOf('Write the instructions')!==-1){
        // Find the "Why the strictness matters" note and inject 1.4 after it
        var el=hc;
        while(el && el.nextElementSibling){
          el=el.nextElementSibling;

          +'<li>Log in to your Docusign developer sandbox at <a href="https://apps-d.docusign.com" target="_blank">apps-d.docusign.com</a>.</li>'
          +'<li>Confirm you can see the <b>Automation</b> tab in the top navigation. If not, ask your facilitator to enable it on your account.</li>'
          +'</ol>'
          +'<h4 style="margin:18px 0 8px;font-size:15px;font-weight:600;">2. Admin setup - enable Agent Studio access</h4>'
          +'<div style="background:#f8f8f8;border:1px solid #e5e1f0;border-radius:10px;padding:14px 16px;margin:10px 0;">'
          +'<ol style="margin:0;padding-left:20px;font-size:13.5px;">'
          +'<li>Open the <b>Admin</b> tab at <a href="https://apps-d.docusign.com/admin/admin-dashboard" target="_blank">apps-d.docusign.com/admin/admin-dashboard</a>.</li>'
          +'<li>Go to <b>Users</b> and find the participant\'s account row.</li>'
          +'<li>Click <b>Actions</b> next to their name, then select <b>Manage AI Agents Access</b>.</li>'
          +'<li>Under <b>AI Contract Agents Access</b>, enable: <b>Create new AI contract agents</b> and <b>Share, delete, and configure AI contract agents</b>.</li>'
          +'<li>Click <b>Save</b>.</li>'
          +'<li>Verify the agent is active: go back to the main app, open the <b>Automation</b> tab, and confirm you can see the <b>Agents</b> section.</li>'
          +'</ol></div>'
          +'<h4 style="margin:18px 0 8px;font-size:15px;font-weight:600;">3. Import the workflow</h4>'
          +'<ol style="margin:0 0 12px;padding-left:20px;">'
          +'<li>Navigate to <b>Agreements</b> tab, then <b>Maestro Workflows</b> in the left menu.</li>'
          +'<li>Click <b>Import Workflow</b>.</li>'
          +'<li>Upload the <code>risk_lab_workflow.zip</code> provided by your facilitator. Leave the file zipped - do not extract it first.</li>'
          +'<li>Confirm the workflow appears on your canvas as a draft.</li>'
          +'</ol>'
          +'<h4 style="margin:18px 0 8px;font-size:15px;font-weight:600;">4. Upload sample agreements</h4>'
          +'<ol style="margin:0 0 12px;padding-left:20px;">'
          +'<li>Go to the <b>Agreements</b> tab.</li>'
          +'<li>Click <b>Completed</b> in the left pane.</li>'
          +'<li>Click the <b>+</b> icon and upload the following three files provided by your facilitator:</li>'
          +'</ol>'
          +'<ul style="margin:0 0 12px;padding-left:36px;">'
          +'<li><code>msa_high_risk.pdf</code></li>'
          +'<li><code>msa_medium_risk.pdf</code></li>'
          +'<li><code>msa_low_risk.pdf</code></li>'
          +'</ul>'
          +'</ul>';
        h.parentNode.insertBefore(prereqHTML,h.nextSibling);
      }
    });

    // === Update NDA 1.1 checkpoint ===
    var ndaExpects=doc.querySelectorAll('.expect');
    ndaExpects.forEach(function(e){
      if(e.textContent.indexOf('agent creation screen with a central description')!==-1){
        e.innerHTML='<b>Checkpoint:</b> you see the agent creation screen with a text block titled "Describe what you want your agent to accomplish...".';
      }
    });

    // === Update NDA Agent Description in 1.2 ===
    var ndaBlocks=doc.querySelectorAll('.block.prompt');
    ndaBlocks.forEach(function(b){
      if(b.textContent.indexOf('Create an agent for checking if we have an existing agreement')!==-1){
        b.textContent='This agent checks whether an NDA already exists with a company. If no NDA is found, it guides the user toward creating an NDA draft. It returns either matching agreement results or a prepared NDA using an existing template.';
      }
    });
    // Update the label before it
    var ndaLbls=doc.querySelectorAll('.lbl');
    ndaLbls.forEach(function(l){
      if(l.textContent==='Initialization string') l.textContent='Agent description';
    });
    // Update 1.2 checkpoint
    ndaExpects=doc.querySelectorAll('.expect');
    ndaExpects.forEach(function(e){
      if(e.textContent.indexOf('agent shell exists and Agent Studio has pre-selected')!==-1){
        e.innerHTML='<b>Checkpoint:</b> the agent is created with the name and description set. You can see the agent setup page with capabilities and instructions sections.';
      }
    });

    // === Update 1.3: Restructure to "Define what starts this agent" format ===
    var ndaHChecks2=doc.querySelectorAll('.h-check');
    ndaHChecks2.forEach(function(hc){
      var h3=hc.querySelector('h3');
      if(h3 && h3.textContent.indexOf('1.3')!==-1 && h3.textContent.indexOf('Review the entry method')!==-1){
        h3.innerHTML='1.3 &middot; Define what starts this agent';
        // Hide all content inside the card
        var card=hc.nextElementSibling;
        if(card && card.classList.contains('card')){
          card.innerHTML='<ol style="margin:10px 0 0;">'
            +'<li>Click <b>In chat</b> under "Define what starts this agent".</li>'
            +'<li>In the prompt field, type:</li>'
            +'</ol>'
            +'<div class="block prompt" style="margin:10px 0;">Check if we have an existing agreement with a company, and if we do not, offer to gather inputs and draft a standard NDA for them.</div>'
            +'<ol start="3">'
            +'<li>Click <b>Save</b>, then scroll to the bottom and click <b>Save</b> again.</li>'
            +'</ol>';
        }
      }
    });

    // === Update 1.3.1 capabilities list ===
    var ndaHChecks=doc.querySelectorAll('.h-check');
    ndaHChecks.forEach(function(hc){
      var h3=hc.querySelector('h3');
      if(h3 && h3.textContent.indexOf('1.3.1')!==-1 && h3.textContent.indexOf('Validate the capabilities')!==-1){
        var card=hc.nextElementSibling;
        if(card && card.classList.contains('card')){
          var ols=card.querySelectorAll('ol');
          ols.forEach(function(ol){
            var lis=ol.querySelectorAll('li');
            lis.forEach(function(li){
              if(li.textContent.indexOf('Find Agreements')!==-1 && li.textContent.indexOf('Generate Documents')!==-1){
                li.innerHTML='Confirm the following are selected: <b>Find Agreements</b>, <b>Generate Documents</b>, <b>Party Insights</b>, <b>Ask the User</b>.';
              }
              if(li.textContent.indexOf('Review Documents')!==-1) li.style.display='none';
            });
          });
          // Update checkpoint
          var expects=card.querySelectorAll('.expect');
          expects.forEach(function(e){
            if(e.textContent.indexOf('Find Agreements')!==-1){
              e.innerHTML='<b>Checkpoint:</b> the Capabilities section lists <b>Find Agreements</b>, <b>Generate Documents</b>, <b>Party Insights</b>, and <b>Ask the User</b>.';
            }
          });
          // Hide the note about Review Documents
          var capNotes=card.querySelectorAll('.note');
          capNotes.forEach(function(n){
            if(n.textContent.indexOf('Review Documents')!==-1) n.style.display='none';
          });
          // Remove screenshot placeholder (image not available yet)
        }
      }
    });

    // === Update 1.4 master instructions with new prompt ===
    ndaBlocks=doc.querySelectorAll('.block.prompt');
    ndaBlocks.forEach(function(b){
      if(b.textContent.indexOf('Role and Core Objective')!==-1 && b.textContent.indexOf('Fontara')!==-1){
        b.textContent='You are Fontara\'s NDA Agreement Checker. Your job is to search Docusign\'s agreement repository for any existing NDA with a named counterparty. If no active agreement is on file, you guide the rep through producing a ready-to-use NDA without leaving this conversation.\n\nStep 1 - Agreement Repository Search (No False Negatives):\nWhen the rep provides a company name, scan the agreement repository immediately.\nSearch guardrail: check for exact matches AND partial matches. If the rep types "Brightpath", also check for "Brightpath Technologies", "Brightpath Inc.", and similar variations before concluding the search returned nothing.\nIf an active NDA is found: show a brief summary of the agreement on file (counterparty name, status, expiry date if available) and stop. Do not offer to create a new NDA.\n\nStep 2 - No Agreement Found: Consistent Offer to Draft:\nIf the search returns zero results, or if every result has a status of "Expired" or "Terminated", respond with this exact text, substituting the company name in the brackets:\n\n"I checked our records and did not find an active NDA for [Company Name] in Docusign. To keep this conversation protected, we should get one in place before moving forward. Would you like me to draft one now?"\n\nStep 3 - Intake (All Inputs Required Before Drafting):\nIf the rep says yes, Use document template Fontara NDA Template to generate the agreement. Ask the user for all fields from the template and merge the values provided by the user in the template.\nDo not draft the NDA until all the required fields are explicitly provided. If the rep supplies only partial answers, ask for the missing items specifically before continuing.\nConfirm to the rep when the agreement has been drafted: "The NDA for [Company Name] is ready for your review."';
      }
    });
    // Update the label for 1.4
    ndaLbls=doc.querySelectorAll('.lbl');
    ndaLbls.forEach(function(l){
      if(l.textContent.indexOf('Agent instructions (replace all generated text')!==-1) l.textContent='Agent instructions';
    });

    // Re-attach copy buttons for NDA blocks
    doc.querySelectorAll('.block').forEach(function(b){
      if(b.style.display==='none') return;
      var existingBtn=b.querySelector('.copy');
      if(existingBtn) existingBtn.remove();
      var btn=doc.createElement('button');btn.className='copy';btn.textContent='Copy';
      btn.addEventListener('click',function(){
        var txt=b.cloneNode(true);var x=txt.querySelector('.copy');if(x)x.remove();
        navigator.clipboard.writeText(txt.textContent.trim()).then(function(){
          btn.textContent='Copied';btn.classList.add('copied');
          setTimeout(function(){btn.textContent='Copy';btn.classList.remove('copied');},1400);
        });
      });
      b.appendChild(btn);
    });
  }

  // Insert toggle after Resources in the sidebar
  var sideFoot=doc.querySelector('.side-foot');
  if(!sideFoot){
    var main=doc.querySelector('main');
    if(!main) return;
    var hero=main.querySelector('.hero');
    if(!hero) return;
    var toggle=injectToggle(doc,current);
    hero.parentNode.insertBefore(toggle,hero.nextSibling);
  } else {
    var toggle=injectToggle(doc,current);
    toggle.style.cssText='background:#F4F2FA;border:1px solid #e5e1f0;border-radius:13px;padding:16px 18px;margin:18px 0 0;box-shadow:0 2px 6px rgba(19,0,50,.05);';
    sideFoot.parentNode.insertBefore(toggle,sideFoot.nextSibling);
  }
}

document.getElementById('frame-nda').addEventListener('load',function(){setupFrame('frame-nda');});
document.getElementById('frame-procurement').addEventListener('load',function(){setupFrame('frame-procurement');});
</script>
