<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Studio 201 - Workshop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:#fff;}
.frame-wrap{position:relative;width:100%;height:100vh;}
.frame-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:none;}
.frame-wrap iframe.active{display:block;}
</style>
</head>
<body>

<div class="frame-wrap">
  <iframe id="frame-nda" src="NDA-Assistant-Flow.html"></iframe>
  <iframe id="frame-procurement" src="2_Hands_on_Flow.html"></iframe>
</div>

<script>
var current=localStorage.getItem('as201-tab')||'nda';
if(current!=='nda'&&current!=='procurement') current='nda';

function injectToggle(doc,active){
  var existing=doc.getElementById('lab-toggle');
  if(existing) existing.parentNode.removeChild(existing);

  var card=doc.createElement('div');
  card.id='lab-toggle';
  card.style.cssText='background:#F4F2FA;border:1px solid #e5e1f0;border-radius:13px;padding:16px 18px;margin:18px 0;box-shadow:0 2px 6px rgba(19,0,50,.05),0 10px 26px rgba(19,0,50,.05);';
  card.innerHTML='<div style="display:inline-flex;gap:0;border:1px solid #e5e1f0;border-radius:9px;overflow:hidden;box-shadow:0 1px 3px rgba(19,0,50,.05);">'
    +'<button data-sc="nda" style="background:'+(active==='nda'?'#4C00FF':'#fff')+';border:none;padding:8px 16px;font-family:DSIndigo,Arial,sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:'+(active==='nda'?'#fff':'#615a75')+';">Lab 1: NDA</button>'
    +'<button data-sc="procurement" style="background:'+(active==='procurement'?'#4C00FF':'#fff')+';border:none;padding:8px 16px;font-family:DSIndigo,Arial,sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:'+(active==='procurement'?'#fff':'#615a75')+';">Lab 2: Procurement</button>'
    +'</div>';

  var btns=card.querySelectorAll('button');
  btns.forEach(function(btn){
    btn.addEventListener('click',function(){
      switchTo(btn.getAttribute('data-sc'));
    });
  });

  return card;
}

function init(){
  document.getElementById('frame-'+current).classList.add('active');
}
init();

function switchTo(tab){
  if(current===tab) return;
  current=tab;
  localStorage.setItem('as201-tab',tab);
  document.querySelectorAll('.frame-wrap iframe').forEach(function(f){f.classList.remove('active');});
  document.getElementById('frame-'+tab).classList.add('active');
  setupFrame('frame-nda');
  setupFrame('frame-procurement');
}

function setupFrame(id){
  var iframe=document.getElementById(id);
  var doc;
  try{doc=iframe.contentDocument||iframe.contentWindow.document;}catch(e){return;}
  if(!doc||!doc.body) return;

  var tab=id.replace('frame-','');

  // Hide the persona card and prerequisites in procurement page
  if(tab==='procurement'){
    var personaCards=doc.querySelectorAll('.card.tint');
    personaCards.forEach(function(c){
      if(c.querySelector('#persona')){c.style.display='none';}
    });
    doc.body.setAttribute('data-persona','procurement');

    // Hide old prerequisites (0.6) and how to use this handbook (0.7), inject new prereqs
    var headings=doc.querySelectorAll('h3');
    headings.forEach(function(h){
      if(h.textContent.indexOf('How to use this handbook')!==-1){
        var el=h;
        while(el){
          var next=el.nextElementSibling;
          if(!next) break;
          if(next.tagName==='H3') break;
          next.style.display='none';
          el=next;
        }
        h.style.display='none';
        if(h.previousElementSibling && h.previousElementSibling.tagName==='H3' && h.previousElementSibling.innerHTML.trim()==='<br>'){
          h.previousElementSibling.style.display='none';
        }
      }
      // Lab 2 prerequisites: kept as-is from HTML (has screenshots and all steps)
    });

    // Fix broken resource links
    var sideFt=doc.querySelector('.side-foot');
    if(sideFt){
      var links=sideFt.querySelectorAll('a');
      var newUrls=[
        ['AI Agent Video Playlist','https://dsucustomers.docusign.com/video-playlist-docusign-ai-agents'],
        ['Agent Studio Support Article','https://support.docusign.com/s/document-item?language=en_US&bundleId=map781cab17-20ee-4e52-a109-43201480b341&topicId=conb2716952-a0f6-4323-a13e-9d23dd290fb0.html&_LANG=enus'],
        ['Where Agents Run','https://support.docusign.com/s/document-item?language=en_US&bundleId=map781cab17-20ee-4e52-a109-43201480b341&topicId=concf520b87-7851-4294-8f82-7e6cc377daaf.html&_LANG=enus'],
        ['Agent Setup for Administrators','https://support.docusign.com/s/document-item?language=en_US&bundleId=map781cab17-20ee-4e52-a109-43201480b341&topicId=task-4922.html&_LANG=enus'],
        ['Ready to Deploy Agent Catalog','https://support.docusign.com/s/document-item?language=en_US&bundleId=map781cab17-20ee-4e52-a109-43201480b341&topicId=ref1d59490e-be57-4db7-8542-ec0cc2d64aff.html&_LANG=enus']
      ];
      for(var i=0;i<links.length&&i<newUrls.length;i++){
        links[i].href=newUrls[i][1];
        links[i].textContent=newUrls[i][0];
      }
      // Remove "Fontara is an approved demo company" text
      var footText=sideFt.childNodes;
      for(var i=0;i<footText.length;i++){
        if(footText[i].nodeType===3 && footText[i].textContent.indexOf('Fontara')!==-1){
          footText[i].textContent=footText[i].textContent.replace('Synthetic data only. Fontara is an approved demo company.','Synthetic data only.');
        }
      }
    }

    // SVG diagram: kept as-is from HTML (already has correct nodes and labels)

    // === Sections 0.3-0.5, Stage 1, Stage 2 intro: all kept as-is from HTML (already correct) ===
    var hChecks=doc.querySelectorAll('.h-check');
    var allPs=doc.querySelectorAll('p');
    var notes=doc.querySelectorAll('.note');

    // === Section 2.1: kept as-is (Import & activate the Request Type) ===

    // === Section 2.2: Hide "Import the workflow" (now a prerequisite) ===
    hChecks.forEach(function(hc){
      var h3=hc.querySelector('h3');
      if(h3 && h3.textContent.indexOf('2.2')!==-1 && h3.textContent.indexOf('Import the workflow')!==-1){
        hc.style.display='none';
        var el=hc.nextElementSibling;
        while(el){
          if(el.classList && el.classList.contains('h-check')) break;
          el.style.display='none';
          el=el.nextElementSibling;
        }
      }
    });

    // === Section 2.4: Hide "Get Document from a Request" entirely ===
    hChecks.forEach(function(hc){
      var h3=hc.querySelector('h3');
      if(h3 && h3.textContent.indexOf('Understand')!==-1 && h3.textContent.indexOf('Get Document')!==-1){
        hc.style.display='none';
        var el=hc.nextElementSibling;
        while(el){
          if(el.classList && el.classList.contains('h-check')) break;
          if(el.tagName==='SECTION') break;
          el.style.display='none';
          el=el.nextElementSibling;
        }
      }
    });

    // === Section 2.5: Rewrite to "Execute AI Agent" - verify agent, outputs, prompt ===
    if(!doc.getElementById('section-25-injected')) hChecks.forEach(function(hc){
      var h3=hc.querySelector('h3');
      if(h3 && h3.textContent.indexOf('Point the agent step')!==-1){
        h3.textContent='2.5 · Execute AI Agent';
        var container=hc.parentElement;
        var sibling=hc.nextElementSibling;
        // Remove everything between this h-check and the next h-check (2.6)
        while(sibling && !sibling.classList.contains('h-check')){
          var next=sibling.nextElementSibling;
          sibling.style.display='none';
          sibling=next;
        }
        // Inject new simplified content after the h-check
        var newContent=document.createElement('div');
        newContent.id='section-25-injected';
        newContent.innerHTML='<p>Open the <b>Execute AI Agent</b> step in the workflow. Verify the following:</p>'
          +'<ol>'
          +'<li><b>Agent selected</b> - your published <code>Vendor &amp; Renewal Risk Analyst</code> should already be selected. If the dropdown is empty, go back to Stage 1 and publish your agent.</li>'
          +'<li><b>Data outputs</b> - confirm the five output fields are visible: <code>risk_level</code>, <code>liability_cap</code>, <code>governing_law</code>, <code>term</code>, <code>discount</code>.</li>'
          +'<li><b>Prompt</b> - verify the chat message / prompt is present in the step configuration.</li>'
          +'</ol>'
          +'<div class="expect"><b>Checkpoint:</b> the Execute AI Agent step shows your agent selected, all five data outputs mapped, and the prompt populated.</div>';
        hc.parentNode.insertBefore(newContent,hc.nextSibling);
      }
    });

    // === Section 2.6: Update branch table and remove fallback ===
    hChecks.forEach(function(hc){
      var h3=hc.querySelector('h3');
      if(h3 && h3.textContent.indexOf('Walk the branch')!==-1){
        h3.innerHTML='2.6 &middot; Walk the branch';
      }
    });

    // Update the paragraph before branch table
    allPs.forEach(function(p){
      if(p.textContent.indexOf('Open the branch step. Confirm three cases')!==-1){
        p.textContent='Open the branch step. Confirm two cases, then follow each path so you know what to expect in Stage 3.';
      }
    });

    // Hide fallback message block and warning
    var blocks=doc.querySelectorAll('.block');
    blocks.forEach(function(b){
      if(b.textContent.indexOf('We tried to process your request automatically')!==-1) b.style.display='none';
    });
    var lbls=doc.querySelectorAll('.lbl');
    lbls.forEach(function(l){
      if(l.textContent.indexOf('Message the fallback path sends')!==-1) l.style.display='none';
    });
    var warns=doc.querySelectorAll('.warn');
    warns.forEach(function(w){
      if(w.textContent.indexOf('Note how the fallback is a real case')!==-1) w.style.display='none';
    });

    // === Stage 3: Rewrite for email intake ===
    var stage3=doc.getElementById('stage-3');
    if(stage3){
      // Update intro
      var stage3Ps=stage3.querySelectorAll(':scope > p');
      if(stage3Ps[0]) stage3Ps[0].innerHTML='Create a request in Agreement Desk, upload a contract, and confirm the workflow fires correctly.';
      if(stage3Ps[1]) stage3Ps[1].style.display='none';

      // Inject request creation steps at top of Stage 3
      if(!doc.getElementById('email-setup-injected')){
        var emailSetup=doc.createElement('div');
        emailSetup.id='email-setup-injected';
        emailSetup.innerHTML='<div class="h-check" style="margin-top:16px;"><div><h3 style="display:inline">3.0 &middot; Create a request in Agreement Desk</h3></div></div>'
          +'<ol style="margin:10px 0 16px;">'
          +'<li>Open the <b>Agreements</b> tab.</li>'
          +'<li>Click <b>Requests</b> in the left menu.</li>'
          +'<li>Click <b>Create Request</b>.</li>'
          +'<li>Select <b>Agent Studio - Risk Lab</b> Request Type.</li>'
          +'<li>Fill in the intake form details (vendor name, requester name, etc.).</li>'
          +'<li>Upload the contract document.</li>'
          +'<li>Click <b>Submit</b>.</li>'
          +'</ol>';
        if(stage3Ps[0]) stage3Ps[0].parentNode.insertBefore(emailSetup,stage3Ps[0].nextSibling);
      }

      // Hide the old document warning
      var stage3Warns=stage3.querySelectorAll('.warn');
      stage3Warns.forEach(function(w){
        if(w.textContent.indexOf('The document is not an intake form field')!==-1) w.style.display='none';
      });

      // Scenario 1
      hChecks.forEach(function(hc){
        var h3=hc.querySelector('h3');
        if(h3 && h3.textContent.indexOf('Scenario 1')!==-1 && h3.textContent.indexOf('LOW')!==-1){
          var ol=hc.nextElementSibling;
          while(ol && ol.tagName!=='OL') ol=ol.nextElementSibling;
          if(ol){
            ol.innerHTML='<li>Go to <b>Agreements → Requests → Create Request</b>.</li>'
              +'<li>Select <b>Agent Studio - Risk Lab</b> Request Type.</li>'
              +'<li>Fill in the form details and upload the <b>LOW</b> sample MSA.</li>'
              +'<li>Click <b>Submit</b>.</li>'
              +'<li>Navigate to <b>Agreements → Maestro Workflows</b>, find the workflow, click <b>View Runs</b>.</li>'
              +'<li>Find the latest run and click the instance.</li>'
              +'<li>Confirm the LOW branch fired and status changed to <b>Success</b>.</li>';
          }
          // Hide the old form table
          var next=ol?ol.nextElementSibling:null;
          while(next){
            if(next.tagName==='TABLE') next.style.display='none';
            if(next.tagName==='OL' && next.getAttribute('start')==='4') {next.style.display='none'; break;}
            next=next.nextElementSibling;
          }
        }
      });

      // Update Scenario 1 expect
      var stage3Expects=stage3.querySelectorAll('.expect');
      stage3Expects.forEach(function(e){
        if(e.textContent.indexOf('Get Document returns the MSA')!==-1){
          e.innerHTML='<b>Expect:</b> the workflow triggers → the agent reads the attached document → returns <code>risk_level = LOW</code> → the LOW branch runs → status changes to <b>Success</b>. You then manually send for signature from the Documents tab.';
        }
      });

      // Scenario 2
      var s2Ps=stage3.querySelectorAll('p.proc-only');
      s2Ps.forEach(function(p){
        if(p.textContent.indexOf('DataVault Dynamics')!==-1){
          p.innerHTML='Create another request: <b>Agreements → Requests → Create Request → Agent Studio - Risk Lab</b>. Upload the <b>HIGH</b> sample MSA, fill in the form, and submit. Check <b>View Runs</b> for the workflow.';
        }
      });
      stage3Expects.forEach(function(e){
        if(e.textContent.indexOf('the review branch runs')!==-1){
          e.innerHTML='<b>Expect:</b> the agent returns <code>MEDIUM</code> or <code>HIGH</code> → the MED/HIGH branch runs → owner assigned (Legal team) → request message sent → status changes to <b>Pending Legal Review</b>.';
        }
      });

      // Scenario 3
      var s3Hchecks=stage3.querySelectorAll('.h-check');
      s3Hchecks.forEach(function(hc){
        var h3=hc.querySelector('h3');
        if(h3 && h3.textContent.indexOf('Scenario 3')!==-1){
          var p=hc.nextElementSibling;
          if(p && p.tagName==='P') p.textContent='Create another request but either skip the document upload entirely, or attach a deliberately unusable file (an empty document, or an image with no readable text).';
        }
      });
      stage3Expects.forEach(function(e){
        if(e.textContent.indexOf('Get Document or the agent step fails')!==-1){
          e.innerHTML='<b>Expect:</b> the agent cannot determine risk from the missing/unreadable document → the workflow handles it gracefully.';
        }
      });

      // Hide Scenario 4 (optional) - no longer needed since UI is default
      notes.forEach(function(n){
        if(n.textContent.indexOf('Optional fourth run')!==-1) n.style.display='none';
      });

      // Update validation checklist (3.4)
      var checklistCard=null;
      var stage3Cards=stage3.querySelectorAll('.card');
      stage3Cards.forEach(function(c){
        var lis=c.querySelectorAll('li');
        lis.forEach(function(li){
          if(li.textContent.indexOf('returns valid JSON with all five fields')!==-1){
            li.innerHTML='<b>Agent</b> - returns the expected outputs with all five fields; <code>risk_level</code> is always one of the three literal values; capabilities let it read the document but not send anything.';
          }
          if(li.textContent.indexOf('Get Document')!==-1 && li.textContent.indexOf('request_document')!==-1){
            li.style.display='none';
          }
          if(li.textContent.indexOf('eSignature')!==-1 && li.textContent.indexOf('envelopes carry')!==-1){
            li.style.display='none';
          }
          if(li.textContent.indexOf('all three branches are reachable')!==-1){
            li.innerHTML='<b>Workflow</b> - published, not draft; the trigger fires only for the right Request Type; both branches are reachable; the agent reads the attached document correctly.';
          }
        });
      });
    }

    // === Inject Stage 4: The CLM connection ===
    if(stage3 && !doc.getElementById('stage-4-injected')){
      var s4=doc.createElement('section');
      s4.className='stage';
      s4.id='stage-4-injected';
      s4.innerHTML='<div class="stage-head"><h2>Stage 4 &middot; The CLM connection</h2><span class="time">Demo only</span></div>'
        +'<div style="background:#fffbeb;border:1.5px solid #f59e0b;border-radius:11px;padding:14px 18px;margin:12px 0 18px;display:flex;gap:12px;align-items:flex-start;"><span style="font-size:18px;">&#9654;</span><div><strong>Watch, don\'t build.</strong> This stage is a facilitated demo, not a hands-on exercise. The CLM "Use AI Agent" step requires a CLM license, CLM-IAM interoperability setup, a PSO-enabled account setting, and a per-environment admin consent link that cannot be completed in a shared lab environment. The goal is to show where the same agent you just built slots into a governed CLM contract workflow.</div></div>'
        +'<div class="h-check"><div><h3 style="display:inline">4.1 &middot; Two stages in the lifecycle, one agent</h3></div></div>'
        +'<div class="card"><p style="margin:0 0 10px;">This lab\'s Maestro workflow handles <b>intake</b>: a new vendor MSA is submitted via Agreement Desk, the agent reviews it, and the workflow routes to signature or legal review. That covers the front door.</p>'
        +'<p style="margin:0 0 10px;">CLM handles a different point in the same lifecycle: <b>negotiation and execution</b>. An MSA is already inside CLM, being redlined and reviewed. Once the legal team finishes a round of changes, the CLM workflow can call the same agent again - now to extract the final risk posture before the document routes for signature. Same agent, different trigger, different moment in the process.</p>'
        +'<p style="margin:0 0 12px;">The "Use AI Agent" step is the bridge. CLM is the orchestration surface; Agent Studio is the reasoning layer. CLM handles the structured steps - approvals, merges, signatures, archiving. The agent handles the part that requires judgment: read the current version of the document and return a structured answer the workflow can act on.</p>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:14px 0;">'
        +'<div style="background:#e9e1fb;border-radius:10px;padding:14px;border:1px solid #4C00FF;"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#4C00FF;margin-bottom:6px;">THIS LAB</div><div style="font-size:13px;font-weight:600;">Agreement Desk + Maestro Workflow</div></div>'
        +'<div style="background:#1f0a4d;border-radius:10px;padding:14px;text-align:center;"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#d9cdff;margin-bottom:6px;">AGENT STUDIO</div><div style="font-size:13px;font-weight:600;color:#fff;">Vendor and Renewal Risk Analyst</div><div style="font-size:11px;color:#c9bdf0;margin-top:4px;">same published agent, both workflow surfaces</div></div>'
        +'<div style="background:#f0fff5;border-radius:10px;padding:14px;border:1px solid #0a7d3c;"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#0a7d3c;margin-bottom:6px;">CLM PATTERN</div><div style="font-size:13px;font-weight:600;">CLM Workflow Designer</div></div>'
        +'</div></div>'
        +'<div class="h-check"><div><h3 style="display:inline">4.2 &middot; What the "Use AI Agent" step looks like in a CLM workflow</h3></div></div>'
        +'<div class="card"><p style="margin:0 0 10px;">In a CLM workflow for MSA negotiation, the "Use AI Agent" step is configured with five fields:</p>'
        +'<table><tbody><tr><th style="width:28%">Field</th><th>Value for the Vendor and Renewal Risk Analyst</th></tr>'
        +'<tr><td><b>Agent</b></td><td>Select the published <code>Vendor and Renewal Risk Analyst</code> from the agent picker. Same agent built in Stage 1 - no second version needed.</td></tr>'
        +'<tr><td><b>Chat Message</b></td><td>The prompt the workflow sends, e.g. <em>"Analyze this vendor contract against our procurement risk checklist. Return risk_level, liability_cap, governing_law, term, and discount. Flag violations with severity and section reference."</em></td></tr>'
        +'<tr><td><b>Document (optional)</b></td><td>Pass the current CLM agreement document so the agent reads the live negotiated version.</td></tr>'
        +'<tr><td><b>Run agent as</b></td><td>An admin user who has completed one-time OAuth consent for this environment. Consent is per-environment - sandbox does not carry to production.</td></tr>'
        +'<tr><td><b>Output variable</b></td><td>Name it <code>AgentResponse</code>. The workflow reads <code>AgentResponse.AgentFinalResponseXml</code> to branch on risk_level.</td></tr>'
        +'</tbody></table></div>'
        +'<div class="h-check"><div><h3 style="display:inline">4.3 &middot; What the output variable contains</h3></div></div>'
        +'<div class="card"><p style="margin:0 0 10px;">After the step runs, the agent\'s response is processed into a structured XML variable:</p>'
        +'<div style="background:#f8f5ff;border-radius:8px;padding:12px 14px;margin:8px 0;font-family:monospace;font-size:12px;line-height:1.8;">'
        +'<div><b>AgentResponse.ThreadId</b> - execution thread identifier</div>'
        +'<div><b>AgentResponse.RunId</b> - specific run identifier</div>'
        +'<div><b>AgentResponse.AgentName</b> - display name of the agent</div>'
        +'<div><b>AgentResponse.AgentFinalResponseRaw</b> - raw text response</div>'
        +'<div><b>AgentResponse.AgentFinalResponseXml</b> - XML-normalized (use this to branch)</div></div>'
        +'<p style="margin:12px 0 6px;">The CLM workflow reads <code>AgentFinalResponseXml</code> to find <code>risk_level</code> and routes accordingly:</p>'
        +'<table><tbody><tr><th style="width:22%">risk_level</th><th>What the CLM workflow does next</th></tr>'
        +'<tr><td><code>LOW</code></td><td>Route to the signature step. No human review required.</td></tr>'
        +'<tr><td><code>MEDIUM</code> / <code>HIGH</code></td><td>Route to a Legal task step. Surfaces the agent\'s extracted terms so the reviewer can act without re-reading the full MSA.</td></tr>'
        +'<tr><td>empty or unexpected</td><td>Route to a fallback task for manual triage. Do not proceed to signature.</td></tr>'
        +'</tbody></table>'
        +'<div style="background:#f0f7ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13px;"><b>Key difference from Maestro:</b> in Maestro the agent step maps output fields directly to workflow variables. In CLM those fields sit inside <code>AgentFinalResponseXml</code> and the workflow must parse the XML path to read them.</div></div>'
        +'<div style="background:#f5f3ff;border-radius:12px;padding:18px 22px;margin:18px 0;"><h3 style="margin:0 0 8px;font-size:16px;">The full picture</h3>'
        +'<p style="margin:0;">You built one agent - the Vendor and Renewal Risk Analyst - and it runs in two places. In Maestro it handles the front door: a new vendor MSA comes in via Agreement Desk, the agent reviews it, and the workflow routes the request. In CLM it handles the negotiation stage: once a contract is inside CLM and being reviewed, the workflow calls the same agent to score the final version before routing to signature. One agent, two surfaces. You don\'t build two agents. You build one good agent, publish it, and put it where the work already happens.</p></div>';
      stage3.parentNode.insertBefore(s4,stage3.nextSibling);
    }

    // Re-attach copy buttons on all visible .block elements (our DOM changes break original handlers)
    doc.querySelectorAll('.block').forEach(function(b){
      if(b.style.display==='none') return;
      var existingBtn=b.querySelector('.copy');
      if(existingBtn) existingBtn.remove();
      var btn=doc.createElement('button');btn.className='copy';btn.textContent='Copy';
      btn.addEventListener('click',function(){
        var txt=b.cloneNode(true);var x=txt.querySelector('.copy');if(x)x.remove();
        navigator.clipboard.writeText(txt.textContent.trim()).then(function(){
          btn.textContent='Copied';btn.classList.add('copied');
          setTimeout(function(){btn.textContent='Copy';btn.classList.remove('copied');},1400);
        });
      });
      b.appendChild(btn);
    });
  }

  // NDA tab: all content now lives directly in the HTML (no JS overrides needed)

  // Insert toggle after the stepper (stages list) in the sidebar - only on active frame
  if(tab===current){
    var stepper=doc.getElementById('stepper');
    if(stepper){
      var toggle=injectToggle(doc,current);
      toggle.style.cssText='background:#F4F2FA;border:1px solid #e5e1f0;border-radius:13px;padding:16px 18px;margin:18px 0 0;box-shadow:0 2px 6px rgba(19,0,50,.05);';
      stepper.parentNode.insertBefore(toggle,stepper.nextSibling);
    }
  }
}

document.getElementById('frame-nda').addEventListener('load',function(){setupFrame('frame-nda');});
document.getElementById('frame-procurement').addEventListener('load',function(){setupFrame('frame-procurement');});
</script>
</body>
</html>
