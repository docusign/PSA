<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Studio 201 - Workshop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:#fff;}
.frame-wrap{position:relative;width:100%;height:100vh;}
.frame-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:none;}
.frame-wrap iframe.active{display:block;}
</style>
</head>
<body>

<div class="frame-wrap">
  <iframe id="frame-nda" class="active" src="NDA-Assistant-Flow.html"></iframe>
  <iframe id="frame-procurement" src="2_Hands_on_Flow.html"></iframe>
</div>

<script>
var current='nda';

function injectToggle(doc,active){
  var existing=doc.getElementById('lab-toggle');
  if(existing) existing.parentNode.removeChild(existing);

  var card=doc.createElement('div');
  card.id='lab-toggle';
  card.style.cssText='background:#F4F2FA;border:1px solid #e5e1f0;border-radius:13px;padding:28px 30px;margin:18px 0;box-shadow:0 2px 6px rgba(19,0,50,.05),0 10px 26px rgba(19,0,50,.05);';
  card.innerHTML='<div style="display:inline-flex;gap:0;border:1px solid #e5e1f0;border-radius:9px;overflow:hidden;box-shadow:0 1px 3px rgba(19,0,50,.05);">'
    +'<button data-sc="nda" style="background:'+(active==='nda'?'#4C00FF':'#fff')+';border:none;padding:8px 16px;font-family:DSIndigo,Arial,sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;color:'+(active==='nda'?'#fff':'#615a75')+';">Lab 1: NDA</button>'
    +'<button data-sc="procurement" style="background:'+(active==='procurement'?'#4C00FF':'#fff')+';border:none;padding:8px 16px;font-family:DSIndigo,Arial,sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;color:'+(active==='procurement'?'#fff':'#615a75')+';">Lab 2: Procurement</button>'
    +'</div>';

  var btns=card.querySelectorAll('button');
  btns.forEach(function(btn){
    btn.addEventListener('click',function(){
      switchTo(btn.getAttribute('data-sc'));
    });
  });

  return card;
}

function switchTo(tab){
  current=tab;
  document.querySelectorAll('.frame-wrap iframe').forEach(function(f){f.classList.remove('active');});
  document.getElementById('frame-'+tab).classList.add('active');
  setupFrame('frame-nda');
  setupFrame('frame-procurement');
}

function setupFrame(id){
  var iframe=document.getElementById(id);
  var doc;
  try{doc=iframe.contentDocument||iframe.contentWindow.document;}catch(e){return;}
  if(!doc||!doc.body) return;

  var tab=id.replace('frame-','');

  // Hide the persona card and prerequisites in procurement page
  if(tab==='procurement'){
    var personaCards=doc.querySelectorAll('.card.tint');
    personaCards.forEach(function(c){
      if(c.querySelector('#persona')){c.style.display='none';}
    });
    doc.body.setAttribute('data-persona','procurement');

    // Hide prerequisites (0.6) and how to use this handbook (0.7)
    var headings=doc.querySelectorAll('h3');
    headings.forEach(function(h){
      if(h.textContent.indexOf('Prerequisites')!==-1 || h.textContent.indexOf('How to use this handbook')!==-1){
        var el=h;
        while(el){
          var next=el.nextElementSibling;
          if(!next) break;
          if(next.tagName==='H3') break;
          next.style.display='none';
          el=next;
        }
        h.style.display='none';
        if(h.previousElementSibling && h.previousElementSibling.tagName==='H3' && h.previousElementSibling.innerHTML.trim()==='<br>'){
          h.previousElementSibling.style.display='none';
        }
      }
    });

    // Update decision tree: LOW risk path
    // Update section 2.6 table row for Low risk
    var tables=doc.querySelectorAll('table');
    tables.forEach(function(t){
      var rows=t.querySelectorAll('tr');
      rows.forEach(function(r){
        var cells=r.querySelectorAll('td');
        if(cells.length>=3 && cells[0].textContent.indexOf('Low risk')!==-1){
          cells[2].innerHTML='<b>Change Owner</b>, then <b>Create Approval Request</b>, then <b>Send Documents for Signature</b> using <code>request_document</code>, then set the Desk status to Onboarded / Signed.';
        }
      });
    });

    // Update 0.4 Reading the diagram - item 4
    var diagramCards=doc.querySelectorAll('.card.tint.diagram');
    diagramCards.forEach(function(card){
      var items=card.querySelectorAll('div');
      items.forEach(function(item){
        var n=item.querySelector('.n');
        if(n && n.textContent==='4'){
          var inner=item.querySelector('div');
          if(inner) inner.innerHTML='<b>Branch on risk_level</b>LOW changes owner, creates an approval request, then sends for signature; MEDIUM or HIGH waits for a human; empty or invalid falls to the defensive path. The agent scores - the workflow decides.';
        }
      });
    });

    // Update scenario description
    var procCards=doc.querySelectorAll('.card.proc-only');
    procCards.forEach(function(card){
      var ps=card.querySelectorAll('p');
      ps.forEach(function(p){
        if(p.textContent.indexOf('LOW risk goes straight to the vendor for signature')!==-1){
          p.innerHTML=p.innerHTML.replace('LOW risk goes straight to the vendor for signature','LOW risk changes owner, creates an approval request, and then sends to the vendor for signature');
        }
      });
    });

    // Update the pipeline summary
    var allPs=doc.querySelectorAll('p');
    allPs.forEach(function(p){
      if(p.textContent.indexOf('branch on risk')!==-1 && p.textContent.indexOf('Send Documents for Signature')!==-1){
        p.innerHTML='<b>Create request → upload contract → Desk request event → Workflow Builder → Get Document from a Request → Risk Analyst agent → branch on risk → Change Owner → Create Approval Request → Send Documents for Signature → update Desk status.</b>';
      }
    });
  }

  // NDA tab modifications
  if(tab==='nda'){
    // Hide Stage 3 (Advanced automation: direct envelope delivery)
    var stage3=doc.getElementById('stage-3');
    if(stage3) stage3.style.display='none';
    // Also hide Stage 3 from sidebar
    var sideSteps=doc.querySelectorAll('.step');
    sideSteps.forEach(function(s){
      if(s.getAttribute('data-target')==='stage-3') s.style.display='none';
    });

    // Replace NDA prerequisites with step-by-step format
    var ndaHeadings=doc.querySelectorAll('h3');
    ndaHeadings.forEach(function(h){
      if(h.textContent.indexOf('Prerequisites')!==-1){
        // Hide old prereq content
        var el=h.nextElementSibling;
        while(el){
          if(el.tagName==='H3') break;
          el.style.display='none';
          el=el.nextElementSibling;
        }
        // Replace heading content and inject new prereqs
        h.innerHTML='0.5 &middot; Prerequisites';
        var prereqHTML=doc.createElement('div');
        prereqHTML.id='new-prereqs';
        if(doc.getElementById('new-prereqs')) return;
        prereqHTML.innerHTML=''
          +'<p style="margin:8px 0;">Complete these steps before the workshop begins. Everything uses synthetic data only - no production accounts or real party data.</p>'
          +'<div style="background:#fffbeb;border:1.5px solid #f59e0b;border-radius:11px;padding:12px 16px;margin:12px 0 16px;font-size:13.5px;"><b>Warning:</b> All data used in this workshop is for demonstration purposes only. Do not use real customer or partner information.</div>'
          +'<h4 style="margin:18px 0 8px;font-size:15px;font-weight:600;">1. Set up your Docusign sandbox</h4>'
          +'<ol style="margin:0 0 12px;padding-left:20px;">'
          +'<li>Log in to your Docusign developer sandbox at <a href="https://apps-d.docusign.com" target="_blank">apps-d.docusign.com</a>.</li>'
          +'<li>Confirm you can see the <b>Agents</b> tab (under Automation). If not, ask your facilitator to enable Agent Studio on your account.</li>'
          +'<li>Confirm <b>Agreement Manager</b> is accessible from the left navigation.</li>'
          +'<li>Confirm <b>Ask Iris Chat</b> is available (bottom-right chat icon) - you will use this to trigger the published agent.</li>'
          +'<li>For Part 2 (advanced): confirm <b>eSignature</b> is enabled with permission to create Templates and send envelopes.</li>'
          +'</ol>'
          +'<div style="background:#f8f8f8;border:1px solid #e5e1f0;border-radius:10px;padding:14px 16px;margin:10px 0;">'
          +'<div style="font-size:12px;font-weight:600;color:#615a75;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">Admin step</div>'
          +'<ol style="margin:0;padding-left:20px;font-size:13.5px;">'
          +'<li>Open the <b>Admin</b> tab at <a href="https://apps-d.docusign.com/admin/admin-dashboard" target="_blank">apps-d.docusign.com/admin/admin-dashboard</a>.</li>'
          +'<li>Go to <b>Users</b> and find the participant\'s account row.</li>'
          +'<li>Click <b>Actions</b> next to their name, then select <b>Manage AI Agents Access</b>.</li>'
          +'<li>Under <b>AI Contract Agents Access</b>, enable: <b>Create new AI contract agents</b> and <b>Share, delete, and configure AI contract agents</b>.</li>'
          +'<li>Click <b>Save</b>.</li>'
          +'</ol></div>'
          +'<h4 style="margin:18px 0 8px;font-size:15px;font-weight:600;">2. Upload sample agreements</h4>'
          +'<ol style="margin:0 0 12px;padding-left:20px;">'
          +'<li>Download the workshop kit from the GitHub repo your facilitator provides.</li>'
          +'<li>Navigate to <b>Agreement Manager</b> in your sandbox.</li>'
          +'<li>Upload the sample NDA PDFs so the agent\'s search capability has documents to find.</li>'
          +'<li>Confirm the agreements appear in the list with their expected statuses (Active, Expired).</li>'
          +'</ol>'
          +'<h4 style="margin:18px 0 8px;font-size:15px;font-weight:600;">3. Foundational knowledge</h4>'
          +'<ul style="margin:0;padding-left:20px;">'
          +'<li>Agent Studio basics: what an agent is, how capabilities are added, and how the Test panel works.</li>'
          +'<li>Agreement Manager basics: how agreements and their statuses (Active, Expired, Terminated) are stored.</li>'
          +'<li>For Part 2: eSignature Templates and Envelope Templates, signer roles, and routing.</li>'
          +'</ul>';
        h.parentNode.insertBefore(prereqHTML,h.nextSibling);
      }
    });
  }

  // Find insertion point (after hero in main)
  var main=doc.querySelector('main');
  if(!main) return;
  var hero=main.querySelector('.hero');
  if(!hero) return;

  var toggle=injectToggle(doc,current);
  hero.parentNode.insertBefore(toggle,hero.nextSibling);
}

document.getElementById('frame-nda').addEventListener('load',function(){setupFrame('frame-nda');});
document.getElementById('frame-procurement').addEventListener('load',function(){setupFrame('frame-procurement');});
</script>
</body>
</html>
