<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Studio 201 - Workshop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:#fff;}
.frame-wrap{position:relative;width:100%;height:100vh;}
.frame-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:none;}
.frame-wrap iframe.active{display:block;}
</style>
</head>
<body>

<div class="frame-wrap">
  <iframe id="frame-nda" src="NDA-Assistant-Flow.html"></iframe>
  <iframe id="frame-procurement" src="2_Hands_on_Flow.html"></iframe>
</div>

<script>
var current=localStorage.getItem('as201-tab')||'nda';
if(current!=='nda'&&current!=='procurement') current='nda';

function injectToggle(doc,active){
  var existing=doc.getElementById('lab-toggle');
  if(existing) existing.parentNode.removeChild(existing);

  var card=doc.createElement('div');
  card.id='lab-toggle';
  card.style.cssText='background:#F4F2FA;border:1px solid #e5e1f0;border-radius:13px;padding:16px 18px;margin:18px 0;box-shadow:0 2px 6px rgba(19,0,50,.05),0 10px 26px rgba(19,0,50,.05);';
  card.innerHTML='<div style="display:inline-flex;gap:0;border:1px solid #e5e1f0;border-radius:9px;overflow:hidden;box-shadow:0 1px 3px rgba(19,0,50,.05);">'
    +'<button data-sc="nda" style="background:'+(active==='nda'?'#4C00FF':'#fff')+';border:none;padding:8px 16px;font-family:DSIndigo,Arial,sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:'+(active==='nda'?'#fff':'#615a75')+';">Lab 1: NDA</button>'
    +'<button data-sc="procurement" style="background:'+(active==='procurement'?'#4C00FF':'#fff')+';border:none;padding:8px 16px;font-family:DSIndigo,Arial,sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:'+(active==='procurement'?'#fff':'#615a75')+';">Lab 2: Procurement</button>'
    +'</div>';

  var btns=card.querySelectorAll('button');
  btns.forEach(function(btn){
    btn.addEventListener('click',function(){
      switchTo(btn.getAttribute('data-sc'));
    });
  });

  return card;
}

function init(){
  document.getElementById('frame-'+current).classList.add('active');
}
init();

function switchTo(tab){
  if(current===tab) return;
  current=tab;
  localStorage.setItem('as201-tab',tab);
  document.querySelectorAll('.frame-wrap iframe').forEach(function(f){f.classList.remove('active');});
  document.getElementById('frame-'+tab).classList.add('active');
  setupFrame('frame-nda');
  setupFrame('frame-procurement');
}

function setupFrame(id){
  var iframe=document.getElementById(id);
  var doc;
  try{doc=iframe.contentDocument||iframe.contentWindow.document;}catch(e){return;}
  if(!doc||!doc.body) return;

  var tab=id.replace('frame-','');

  // Hide the persona card and prerequisites in procurement page
  if(tab==='procurement'){
    var personaCards=doc.querySelectorAll('.card.tint');
    personaCards.forEach(function(c){
      if(c.querySelector('#persona')){c.style.display='none';}
    });
    doc.body.setAttribute('data-persona','procurement');

    // Hide old prerequisites (0.6) and how to use this handbook (0.7), inject new prereqs
    var headings=doc.querySelectorAll('h3');
    headings.forEach(function(h){
      if(h.textContent.indexOf('How to use this handbook')!==-1){
        var el=h;
        while(el){
          var next=el.nextElementSibling;
          if(!next) break;
          if(next.tagName==='H3') break;
          next.style.display='none';
          el=next;
        }
        h.style.display='none';
        if(h.previousElementSibling && h.previousElementSibling.tagName==='H3' && h.previousElementSibling.innerHTML.trim()==='<br>'){
          h.previousElementSibling.style.display='none';
        }
      }
      if(h.textContent.indexOf('Prerequisites')!==-1 && !doc.getElementById('proc-prereqs')){
        // Hide old prereq content
        var el=h;
        while(el){
          var next=el.nextElementSibling;
          if(!next) break;
          if(next.tagName==='H3') break;
          next.style.display='none';
          el=next;
        }
        if(h.previousElementSibling && h.previousElementSibling.tagName==='H3' && h.previousElementSibling.innerHTML.trim()==='<br>'){
          h.previousElementSibling.style.display='none';
        }
        h.innerHTML='0.5 &middot; Prerequisites';
        var prereqDiv=doc.createElement('div');
        prereqDiv.id='proc-prereqs';
        prereqDiv.innerHTML=''
          +'<p style="margin:8px 0;">Complete these steps before the workshop begins.</p>'
          +'<h4 style="margin:18px 0 8px;font-size:15px;font-weight:600;">1. Active Docusign developer account</h4>'
          +'<ol style="margin:0 0 12px;padding-left:20px;">'
          +'<li>Log in to your Docusign developer sandbox at <a href="https://apps-d.docusign.com" target="_blank">apps-d.docusign.com</a>.</li>'
          +'<li>Confirm you can see the <b>Automations</b> tab in the top navigation. If not, ask your facilitator to enable it on your account.</li>'
          +'</ol>'
          +'<h4 style="margin:18px 0 8px;font-size:15px;font-weight:600;">2. Admin setup - enable Agent Studio access</h4>'
          +'<div style="background:#f8f8f8;border:1px solid #e5e1f0;border-radius:10px;padding:14px 16px;margin:10px 0;">'
          +'<ol style="margin:0;padding-left:20px;font-size:13.5px;">'
          +'<li>Open the <b>Admin</b> tab at <a href="https://apps-d.docusign.com/admin/admin-dashboard" target="_blank">apps-d.docusign.com/admin/admin-dashboard</a>.</li>'
          +'<li>Go to <b>AI Control Settings</b> and ensure Agent and chat capabilities are turned on.</li>'
          +'<li>In case they are turned off by default, select <b>Turn On Now</b> and click <b>Save</b>.</li>'
          +'<li>Go to <b>Users</b> and find the participant\'s account row.</li>'
          +'<li>Click <b>Actions</b> next to their name, then select <b>Manage AI Agents Access</b>.</li>'
          +'<li>Under <b>AI Agents Access</b>, enable: <b>Create new AI contract agents</b> and <b>Share, delete, and configure AI contract agents</b>.</li>'
          +'<li>Click <b>Save</b>.</li>'
          +'<li>Verify the agent is active: go back to the main app, open the <b>Automations</b> tab, and confirm you can see the <b>Agents</b> section.</li>'
          +'</ol></div>'
          +'<h4 style="margin:18px 0 8px;font-size:15px;font-weight:600;">3. Import the workflow</h4>'
          +'<ol style="margin:0 0 12px;padding-left:20px;">'
          +'<li>Navigate to <b>Agreements</b> tab, then <b>Maestro Workflows</b> in the left menu.</li>'
          +'<li>Click <b>Import Workflow</b>.</li>'
          +'<li>Upload the workflow zip from the workshop kit provided by your facilitator. Leave the file zipped - do not extract it first.</li>'
          +'<li>Confirm the workflow appears on your canvas as a draft.</li>'
          +'<li>Click <b>Save</b>, then <b>Publish</b> the workflow.</li>'
          +'</ol>'
          +'<h4 style="margin:18px 0 8px;font-size:15px;font-weight:600;">4. Upload sample agreements</h4>'
          +'<ol style="margin:0 0 12px;padding-left:20px;">'
          +'<li>Go to the <b>Agreements</b> tab.</li>'
          +'<li>Click <b>Completed</b> in the left pane.</li>'
          +'<li>Click the <b>+</b> icon and upload the sample agreements provided in the workshop kit.</li>'
          +'</ol>';
        h.parentNode.insertBefore(prereqDiv,h.nextSibling);
      }
    });

    // Fix broken resource links
    var sideFt=doc.querySelector('.side-foot');
    if(sideFt){
      var links=sideFt.querySelectorAll('a');
      var newUrls=[
        ['AI Agent Video Playlist','https://dsucustomers.docusign.com/video-playlist-docusign-ai-agents'],
        ['Agent Studio Support Article','https://support.docusign.com/s/document-item?language=en_US&bundleId=map781cab17-20ee-4e52-a109-43201480b341&topicId=conb2716952-a0f6-4323-a13e-9d23dd290fb0.html&_LANG=enus'],
        ['Where Agents Run','https://support.docusign.com/s/document-item?language=en_US&bundleId=map781cab17-20ee-4e52-a109-43201480b341&topicId=concf520b87-7851-4294-8f82-7e6cc377daaf.html&_LANG=enus'],
        ['Agent Setup for Administrators','https://support.docusign.com/s/document-item?language=en_US&bundleId=map781cab17-20ee-4e52-a109-43201480b341&topicId=task-4922.html&_LANG=enus'],
        ['Ready to Deploy Agent Catalog','https://support.docusign.com/s/document-item?language=en_US&bundleId=map781cab17-20ee-4e52-a109-43201480b341&topicId=ref1d59490e-be57-4db7-8542-ec0cc2d64aff.html&_LANG=enus']
      ];
      for(var i=0;i<links.length&&i<newUrls.length;i++){
        links[i].href=newUrls[i][1];
        links[i].textContent=newUrls[i][0];
      }
      // Remove "Fontara is an approved demo company" text
      var footText=sideFt.childNodes;
      for(var i=0;i<footText.length;i++){
        if(footText[i].nodeType===3 && footText[i].textContent.indexOf('Fontara')!==-1){
          footText[i].textContent=footText[i].textContent.replace('Synthetic data only. Fontara is an approved demo company.','Synthetic data only.');
        }
      }
    }

    // Rebuild SVG diagram for new flow
    var svg=doc.querySelector('svg[viewBox]');
    if(svg && !doc.getElementById('nodeChangeStatus')){
      var ns='http://www.w3.org/2000/svg';
      var svgTexts=svg.querySelectorAll('text');

      // Hide everything in the original SVG, then rebuild
      svg.querySelectorAll('rect,line,path,polygon,text,circle').forEach(function(el){el.style.display='none';});
      // Keep defs (arrows)
      svg.querySelectorAll('defs *').forEach(function(el){el.style.display='';});

      svg.setAttribute('viewBox','0 0 940 420');

      // --- MAIN ROW: Agreement Desk -> Risk Analyst -> Branch ---
      // Agreement Desk
      var ad=document.createElementNS(ns,'rect');
      ad.setAttribute('x','30');ad.setAttribute('y','165');ad.setAttribute('width','150');ad.setAttribute('height','64');ad.setAttribute('rx','12');ad.setAttribute('fill','#4C00FF');
      svg.appendChild(ad);
      var adT1=document.createElementNS(ns,'text');adT1.setAttribute('x','105');adT1.setAttribute('y','192');adT1.setAttribute('text-anchor','middle');adT1.setAttribute('fill','#fff');adT1.setAttribute('font-size','13');adT1.setAttribute('font-weight','600');adT1.textContent='Agreement Desk';svg.appendChild(adT1);
      var adT2=document.createElementNS(ns,'text');adT2.setAttribute('x','105');adT2.setAttribute('y','209');adT2.setAttribute('text-anchor','middle');adT2.setAttribute('fill','#e7deff');adT2.setAttribute('font-size','10.5');adT2.textContent='Create request';svg.appendChild(adT2);

      // Edge AD -> Agent
      var e1=document.createElementNS(ns,'line');e1.setAttribute('x1','180');e1.setAttribute('y1','197');e1.setAttribute('x2','220');e1.setAttribute('y2','197');e1.setAttribute('stroke','#c9bdf0');e1.setAttribute('stroke-width','2.5');e1.setAttribute('marker-end','url(#arrow)');svg.appendChild(e1);

      // Risk Analyst
      var ra=document.createElementNS(ns,'rect');ra.setAttribute('x','221');ra.setAttribute('y','165');ra.setAttribute('width','150');ra.setAttribute('height','64');ra.setAttribute('rx','12');ra.setAttribute('fill','#9A1FA8');svg.appendChild(ra);
      var raT1=document.createElementNS(ns,'text');raT1.setAttribute('x','296');raT1.setAttribute('y','188');raT1.setAttribute('text-anchor','middle');raT1.setAttribute('fill','#fff');raT1.setAttribute('font-size','12.5');raT1.setAttribute('font-weight','600');raT1.textContent='Risk Analyst';svg.appendChild(raT1);
      var raT2=document.createElementNS(ns,'text');raT2.setAttribute('x','296');raT2.setAttribute('y','203');raT2.setAttribute('text-anchor','middle');raT2.setAttribute('fill','#f2ddff');raT2.setAttribute('font-size','10.5');raT2.textContent='Agent Studio';svg.appendChild(raT2);
      var raT3=document.createElementNS(ns,'text');raT3.setAttribute('x','296');raT3.setAttribute('y','217');raT3.setAttribute('text-anchor','middle');raT3.setAttribute('fill','#e3b6ff');raT3.setAttribute('font-size','10');raT3.textContent='reads attached doc';svg.appendChild(raT3);

      // Edge Agent -> Branch
      var e2=document.createElementNS(ns,'line');e2.setAttribute('x1','371');e2.setAttribute('y1','197');e2.setAttribute('x2','410');e2.setAttribute('y2','197');e2.setAttribute('stroke','#c9bdf0');e2.setAttribute('stroke-width','2.5');e2.setAttribute('marker-end','url(#arrow)');svg.appendChild(e2);

      // Branch diamond
      var diamond=document.createElementNS(ns,'polygon');diamond.setAttribute('points','455,157 500,197 455,237 410,197');diamond.setAttribute('fill','#fff');diamond.setAttribute('stroke','#4C00FF');diamond.setAttribute('stroke-width','2');svg.appendChild(diamond);
      var dT1=document.createElementNS(ns,'text');dT1.setAttribute('x','455');dT1.setAttribute('y','193');dT1.setAttribute('text-anchor','middle');dT1.setAttribute('fill','#130032');dT1.setAttribute('font-size','10.5');dT1.setAttribute('font-weight','600');dT1.textContent='risk';svg.appendChild(dT1);
      var dT2=document.createElementNS(ns,'text');dT2.setAttribute('x','455');dT2.setAttribute('y','205');dT2.setAttribute('text-anchor','middle');dT2.setAttribute('fill','#130032');dT2.setAttribute('font-size','10.5');dT2.setAttribute('font-weight','600');dT2.textContent='_level?';svg.appendChild(dT2);

      // --- LOW PATH (straight right): Change Status "Success" ---
      var lowLabel=document.createElementNS(ns,'text');lowLabel.setAttribute('x','530');lowLabel.setAttribute('y','187');lowLabel.setAttribute('text-anchor','middle');lowLabel.setAttribute('font-size','11');lowLabel.setAttribute('font-weight','600');lowLabel.setAttribute('fill','#0a7d3c');lowLabel.textContent='LOW';svg.appendChild(lowLabel);
      var e3=document.createElementNS(ns,'line');e3.setAttribute('x1','500');e3.setAttribute('y1','197');e3.setAttribute('x2','560');e3.setAttribute('y2','197');e3.setAttribute('stroke','#0a7d3c');e3.setAttribute('stroke-width','2.5');e3.setAttribute('marker-end','url(#arrow)');svg.appendChild(e3);

      var csRect=document.createElementNS(ns,'rect');csRect.setAttribute('id','nodeChangeStatus');csRect.setAttribute('x','561');csRect.setAttribute('y','165');csRect.setAttribute('width','140');csRect.setAttribute('height','64');csRect.setAttribute('rx','12');csRect.setAttribute('fill','#0a7d3c');svg.appendChild(csRect);
      var csT1=document.createElementNS(ns,'text');csT1.setAttribute('x','631');csT1.setAttribute('y','192');csT1.setAttribute('text-anchor','middle');csT1.setAttribute('fill','#fff');csT1.setAttribute('font-size','12');csT1.setAttribute('font-weight','600');csT1.textContent='Change Status';svg.appendChild(csT1);
      var csT2=document.createElementNS(ns,'text');csT2.setAttribute('x','631');csT2.setAttribute('y','209');csT2.setAttribute('text-anchor','middle');csT2.setAttribute('fill','#d7f5e2');csT2.setAttribute('font-size','10.5');csT2.textContent='Success';svg.appendChild(csT2);

      // --- MED/HIGH PATH (down): Assign Owner -> Send Message -> Change Status ---
      var mhLabel=document.createElementNS(ns,'text');mhLabel.setAttribute('x','470');mhLabel.setAttribute('y','260');mhLabel.setAttribute('font-size','11');mhLabel.setAttribute('font-weight','600');mhLabel.setAttribute('fill','#FF5252');mhLabel.textContent='MED / HIGH';svg.appendChild(mhLabel);
      var e4=document.createElementNS(ns,'path');e4.setAttribute('d','M455,237 V280');e4.setAttribute('stroke','#FF5252');e4.setAttribute('stroke-width','2.5');e4.setAttribute('fill','none');e4.setAttribute('marker-end','url(#arrow)');svg.appendChild(e4);

      // Assign Owner
      var ao=document.createElementNS(ns,'rect');ao.setAttribute('x','380');ao.setAttribute('y','282');ao.setAttribute('width','150');ao.setAttribute('height','56');ao.setAttribute('rx','12');ao.setAttribute('fill','#C0207E');svg.appendChild(ao);
      var aoT1=document.createElementNS(ns,'text');aoT1.setAttribute('x','455');aoT1.setAttribute('y','306');aoT1.setAttribute('text-anchor','middle');aoT1.setAttribute('fill','#fff');aoT1.setAttribute('font-size','12');aoT1.setAttribute('font-weight','600');aoT1.textContent='Assign Owner';svg.appendChild(aoT1);
      var aoT2=document.createElementNS(ns,'text');aoT2.setAttribute('x','455');aoT2.setAttribute('y','322');aoT2.setAttribute('text-anchor','middle');aoT2.setAttribute('fill','#ffe0ef');aoT2.setAttribute('font-size','10.5');aoT2.textContent='Legal team';svg.appendChild(aoT2);

      // Edge Assign Owner -> Send Message
      var e5=document.createElementNS(ns,'line');e5.setAttribute('x1','530');e5.setAttribute('y1','310');e5.setAttribute('x2','570');e5.setAttribute('y2','310');e5.setAttribute('stroke','#c9bdf0');e5.setAttribute('stroke-width','2.5');e5.setAttribute('marker-end','url(#arrow)');svg.appendChild(e5);

      // Send Message
      var sm=document.createElementNS(ns,'rect');sm.setAttribute('x','571');sm.setAttribute('y','282');sm.setAttribute('width','150');sm.setAttribute('height','56');sm.setAttribute('rx','12');sm.setAttribute('fill','#6A17C9');svg.appendChild(sm);
      var smT1=document.createElementNS(ns,'text');smT1.setAttribute('x','646');smT1.setAttribute('y','306');smT1.setAttribute('text-anchor','middle');smT1.setAttribute('fill','#fff');smT1.setAttribute('font-size','12');smT1.setAttribute('font-weight','600');smT1.textContent='Send Message';svg.appendChild(smT1);
      var smT2=document.createElementNS(ns,'text');smT2.setAttribute('x','646');smT2.setAttribute('y','322');smT2.setAttribute('text-anchor','middle');smT2.setAttribute('fill','#e7deff');smT2.setAttribute('font-size','10.5');smT2.textContent='Notify reviewer';svg.appendChild(smT2);

      // Edge Send Message -> Change Status
      var e6=document.createElementNS(ns,'line');e6.setAttribute('x1','721');e6.setAttribute('y1','310');e6.setAttribute('x2','761');e6.setAttribute('y2','310');e6.setAttribute('stroke','#c9bdf0');e6.setAttribute('stroke-width','2.5');e6.setAttribute('marker-end','url(#arrow)');svg.appendChild(e6);

      // Change Status (Pending Legal Review)
      var plr=document.createElementNS(ns,'rect');plr.setAttribute('x','762');plr.setAttribute('y','282');plr.setAttribute('width','150');plr.setAttribute('height','56');plr.setAttribute('rx','12');plr.setAttribute('fill','#FF5252');svg.appendChild(plr);
      var plrT1=document.createElementNS(ns,'text');plrT1.setAttribute('x','837');plrT1.setAttribute('y','302');plrT1.setAttribute('text-anchor','middle');plrT1.setAttribute('fill','#fff');plrT1.setAttribute('font-size','11.5');plrT1.setAttribute('font-weight','600');plrT1.textContent='Change Status';svg.appendChild(plrT1);
      var plrT2=document.createElementNS(ns,'text');plrT2.setAttribute('x','837');plrT2.setAttribute('y','318');plrT2.setAttribute('text-anchor','middle');plrT2.setAttribute('fill','#ffe0ef');plrT2.setAttribute('font-size','10');plrT2.textContent='Pending Legal Review';svg.appendChild(plrT2);

      // Animated particles - route paths
      var routeLow=document.createElementNS(ns,'path');routeLow.setAttribute('id','route-low-new');routeLow.setAttribute('d','M105,197 L296,197 L455,197 L631,197');routeLow.setAttribute('fill','none');svg.appendChild(routeLow);
      var routeHigh=document.createElementNS(ns,'path');routeHigh.setAttribute('id','route-high-new');routeHigh.setAttribute('d','M105,197 L296,197 L455,197 L455,310 L646,310 L837,310');routeHigh.setAttribute('fill','none');svg.appendChild(routeHigh);

      // LOW particle
      var pLow=document.createElementNS(ns,'circle');pLow.setAttribute('r','5');pLow.setAttribute('fill','#0a7d3c');pLow.setAttribute('style','filter:drop-shadow(0 0 5px #0a7d3c)');
      var amLow=document.createElementNS(ns,'animateMotion');amLow.setAttribute('dur','3.2s');amLow.setAttribute('repeatCount','indefinite');
      var mpLow=document.createElementNS(ns,'mpath');mpLow.setAttribute('href','#route-low-new');
      amLow.appendChild(mpLow);pLow.appendChild(amLow);svg.appendChild(pLow);

      // MED/HIGH particle
      var pHigh=document.createElementNS(ns,'circle');pHigh.setAttribute('r','5');pHigh.setAttribute('fill','#FF5252');pHigh.setAttribute('style','filter:drop-shadow(0 0 5px #FF5252)');
      var amHigh=document.createElementNS(ns,'animateMotion');amHigh.setAttribute('dur','4s');amHigh.setAttribute('repeatCount','indefinite');
      var mpHigh=document.createElementNS(ns,'mpath');mpHigh.setAttribute('href','#route-high-new');
      amHigh.appendChild(mpHigh);pHigh.appendChild(amHigh);svg.appendChild(pHigh);

      // Wire explorer controls to rebuilt SVG
      var ctrlMissing=doc.getElementById('ctrlMissing');
      var ctrlRisk=doc.getElementById('ctrlRisk');
      if(ctrlMissing) ctrlMissing.parentElement.style.display='none';
      // Rename dropdown options
      if(ctrlRisk){
        var riskOpts=ctrlRisk.querySelectorAll('option');
        riskOpts.forEach(function(o){
          if(o.value==='low') o.textContent='LOW - Auto Approved';
          if(o.value==='medium') o.textContent='MEDIUM/HIGH - Route for Approvals';
          if(o.value==='high') o.textContent='HIGH - Route for Approvals';
        });
      }
      if(ctrlRisk){
        ctrlRisk.removeEventListener('change',ctrlRisk._handler);
        ctrlRisk._handler=function(){
          pLow.style.display=ctrlRisk.value==='low'?'':'none';
          pHigh.style.display=ctrlRisk.value!=='low'?'':'none';
          var stAgent=doc.getElementById('statusAgent');
          var stRoute=doc.getElementById('statusRoute');
          if(stAgent){
            stAgent.textContent=ctrlRisk.value.toUpperCase();
            stAgent.className='v risk-'+(ctrlRisk.value==='low'?'low':'high');
          }
          if(stRoute){
            stRoute.textContent=ctrlRisk.value==='low'?'Straight to Change Status Success.':'Assign Owner, Send Message, Change Status Pending Legal Review.';
            stRoute.className='v risk-'+(ctrlRisk.value==='low'?'low':'high');
          }
        };
        ctrlRisk.addEventListener('change',ctrlRisk._handler);
        // Set initial state - high is default
        pLow.style.display='none';
        var stAgent=doc.getElementById('statusAgent');
        var stRoute=doc.getElementById('statusRoute');
        if(stAgent){stAgent.textContent='HIGH';stAgent.className='v risk-high';}
        if(stRoute){stRoute.textContent='Assign Owner, Send Message, Change Status Pending Legal Review.';stRoute.className='v risk-high';}
      }
    }

    // Update decision tree table (section 2.6)
    var tables=doc.querySelectorAll('table');
    tables.forEach(function(t){
      var rows=t.querySelectorAll('tr');
      rows.forEach(function(r){
        var cells=r.querySelectorAll('td');
        if(cells.length>=3){
          if(cells[0].textContent.indexOf('Low risk')!==-1){
            cells[2].innerHTML='<b>Change Request Status</b> to Success. The request owner can then send the document for eSignature.';
          }
          if(cells[0].textContent.indexOf('Medium or high')!==-1){
            cells[2].innerHTML='<b>Assign Owner</b> (Legal team), <b>Send Request Message</b> to notify them, then <b>Change Request Status</b> to Pending Legal Review.';
          }
          // Remove fallback row
          if(cells[0].textContent.indexOf('Fallback')!==-1){
            r.style.display='none';
          }
        }
      });
    });

    // Hide 0.4 "Reading the diagram" section entirely (merged with 0.2)
    var headings=doc.querySelectorAll('h3');
    headings.forEach(function(h){

      if(b.style.display==='none') return;
      var existingBtn=b.querySelector('.copy');
      if(existingBtn) existingBtn.remove();
      var btn=doc.createElement('button');btn.className='copy';btn.textContent='Copy';
      btn.addEventListener('click',function(){
        var txt=b.cloneNode(true);var x=txt.querySelector('.copy');if(x)x.remove();
        navigator.clipboard.writeText(txt.textContent.trim()).then(function(){
          btn.textContent='Copied';btn.classList.add('copied');
          setTimeout(function(){btn.textContent='Copy';btn.classList.remove('copied');},1400);
        });
      });
      b.appendChild(btn);
    });
  }

  // Insert toggle after the stepper (stages list) in the sidebar - only on active frame
  if(tab===current){
    var stepper=doc.getElementById('stepper');
    if(stepper){
      var toggle=injectToggle(doc,current);
      toggle.style.cssText='background:#F4F2FA;border:1px solid #e5e1f0;border-radius:13px;padding:16px 18px;margin:18px 0 0;box-shadow:0 2px 6px rgba(19,0,50,.05);';
      stepper.parentNode.insertBefore(toggle,stepper.nextSibling);
    }
  }
}

document.getElementById('frame-nda').addEventListener('load',function(){setupFrame('frame-nda');});
document.getElementById('frame-procurement').addEventListener('load',function(){setupFrame('frame-procurement');});
</script>
</body>
