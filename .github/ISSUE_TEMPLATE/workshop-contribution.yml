name: Submit workshop content
description: Create a workshop page and add it to the One PSA hub
title: "[Contribution] "
labels: ["contribution"]
body:
  - type: input
    id: title
    attributes:
      label: Content title
      placeholder: e.g. Invoice Extraction with Agent Studio
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Content type
      options:
        - Hands-on lab
        - Demo script
        - Slide deck
        - Guide / how-to
        - Sample data / assets
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - 101 – Intro
        - 201 – Intermediate
        - 301 – Advanced
      default: 1
  - type: input
    id: team
    attributes:
      label: Region / team
      placeholder: e.g. AMER PSA
  - type: checkboxes
    id: products
    attributes:
      label: Products used
      options:
        - label: Agent Studio
        - label: Workflow Builder
        - label: CLM
        - label: eSignature
        - label: Navigator
        - label: MCP
        - label: Salesforce
        - label: Other
  - type: textarea
    id: outcome
    attributes:
      label: What does the attendee build?
    validations:
      required: true
  - type: input
    id: duration
    attributes:
      label: Duration (minutes)
      placeholder: "60"
  - type: input
    id: link
    attributes:
      label: Link to content
      description: Must be viewable by Docusign employees (Drive, GitHub, SharePoint).
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Known gaps or notes for reviewers
