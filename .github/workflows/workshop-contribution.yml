name: Create workshop page from contribution

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create:
    if: contains(github.event.issue.labels.*.name, 'contribution')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write issue body to file
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"

      - name: Generate page and hub card
        id: gen
        run: node scripts/add-contribution.js "$RUNNER_TEMP/body.md" "${{ github.event.issue.number }}"

      - name: Open review PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          SLUG: ${{ steps.gen.outputs.slug }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          BRANCH="workshop-contribution-$ISSUE"
          git config user.name "hub-bot"
          git config user.email "hub-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add workshops Agent-Studio-201/hub.html
          git commit -m "Add workshop page from contribution #$ISSUE"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "Workshop contribution #$ISSUE" \
            --body "Generated from issue #$ISSUE. Closes #$ISSUE. The submitter can edit workshops/$SLUG in this PR before merging. Merging publishes the page and its hub card.")
          {
            echo "Your workshop page is ready."
            echo
            echo "**1. Edit your page:** [Open the editor]($REPO_URL/edit/$BRANCH/workshops/$SLUG/index.html). Replace the placeholder sections, then click **Commit changes**."
            echo
            echo "**2. Check it with your Glean:** the prompt is in the page's *Verify with Glean* section."
            echo
            echo "**3. Publish:** $PR_URL. Once it's merged, your page goes live at https://docusign.github.io/PSA/workshops/$SLUG/ and appears on the [hub](https://docusign.github.io/PSA/Agent-Studio-201/hub.html)."
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
